[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp-telegram"
version = "0.0.1"
description = "Reference Telegram remote driver for imp (reads NDJSON events on stdin, writes chat replies on stdout)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
imp-telegram = "imp_telegram:main"

[tool.hatch.build.targets.wheel]
only-include = ["imp_telegram.py"]

[tool.hatch.build.targets.wheel.sources]
"imp_telegram.py" = "imp_telegram.py"
