  <circle cx="70" cy="30" r="6" fill="#28c840"/>
  <text x="320" y="35" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">imp</text>

  <g transform="translate(224 72) scale(12)" shape-rendering="crispEdges">
