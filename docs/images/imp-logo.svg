  <text x="320" y="303" fill="#9aa0a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-style="italic" text-anchor="middle">mischief, at your command.</text>
  <text x="48" y="368" fill="#ff9a3c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">&gt; </text>
