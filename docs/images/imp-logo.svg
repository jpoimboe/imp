<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title description">
  <title id="title">imp terminal splash</title>
  <desc id="description">A terminal window showing the orange pixel-art imp, the phrase “mischief, at your command.”, and an input prompt.</desc>

  <rect x="8" y="8" width="624" height="404" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
