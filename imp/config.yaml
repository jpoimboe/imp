default-workflow: default
default-base: master

# Optional lint-clean gate: a command the implementer runs before each
# commit (separate from the test suite). Absent => no lint gate.
# lint_command: "make lint"
#
# Tiered test gates: test_cmd_fast (lint + typecheck + fast tests) runs at every
# per-plan gate (verify); test_cmd_slow — the complete run, a
# superset — runs once per Change at integration-verify. Each tier has its own
# wall-clock timeout in seconds; on timeout the gate pauses to a human (exit 124)
# rather than looping against an unwinnable clock. Set explicitly above the schema
# defaults (120 fast / 300 slow) — batched integrations trip the tighter clock.
test_cmd_fast: "make check"
test_cmd_slow: "make check && make test-live"
test_cmd_fast_timeout: 300
test_cmd_slow_timeout: 600

# Worktree-relative import roots prepended to gate/agent subprocess PYTHONPATH so
# an editable-installed imp resolves to the worktree, not the main checkout.
pythonpath: [src]

# Command imp runs in each newly created quest worktree, before the first step,
# and again after an integration rebase: `git worktree` materializes only
# tracked files, so a new tree has no .venv, and a rebase can change the deps.
worktree_setup: uv sync --all-extras

# Ambient vars forwarded into the sandbox by name. IMP_E2E_POLL_TIMEOUT lifts the
# in-sandbox e2e poll ceilings on a loaded host; engine vars come from engine_env,
# never from the ambient environment.
sandbox:
  env_passthrough: [IMP_E2E_POLL_TIMEOUT]
