providers: [claude_code, openai]

tiers:
  low:    {claude_code: haiku,  openai: gpt-5.4-mini}
  medium: {claude_code: sonnet, openai: gpt-5.3-codex}
  high:   {claude_code: opus,   openai: gpt-5.5}

provider_envs:
  openai: {env: OPENAI_API_KEY}

# Color theme: dark | light | ansi. Normally written by `imp init` from
# terminal detection; set here so this dogfood checkout emits the dark
# truecolor palette live. Override per-run with IMP_THEME=...
theme: dark

# Optional lint-clean gate: a command the implementer runs before each
# commit (separate from the test suite). Absent => no lint gate.
# lint_command: "make lint"
