default-workflow: imp

guidance: |
  imp is pre-release with no external users. Skip backward-compatibility entirely
  in designs and plans — no migration paths, no state.json/event-payload
  fallbacks for old versions, no dataclass defaults added only to read older
  files (DO preserve invariants within a single in-flight run). Design docs are
  point-in-time: write each self-contained; don't reconcile or update superseded
  specs.

  When working on imp's TUI, output, or user-facing copy, read
  docs/imp-conventions.md. When editing imp's engine/renderer or workflow
  prompts, read docs/imp-invariants.md.

# Optional lint-clean gate: a command the implementer runs before each
# commit (separate from the test suite). Absent => no lint gate.
# lint_command: "make lint"
#
# Tiered test gates: test_cmd_fast (lint + typecheck + fast tests) runs at every
# per-plan gate (verify, sweep-verify); test_cmd_slow — the complete run, a
# superset — runs once per Change at integration-verify. Each tier has its own
# wall-clock timeout in seconds; on timeout the gate pauses to a human (exit 124)
# rather than looping against an unwinnable clock. Set explicitly above the schema
# defaults (120 fast / 300 slow) — batched integrations trip the tighter clock.
test_cmd_fast: "make check"
test_cmd_slow: "make check && make test-live"
test_cmd_fast_timeout: 240
test_cmd_slow_timeout: 600
