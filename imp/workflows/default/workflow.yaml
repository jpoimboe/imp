name: feature
description: |
  spec -> (plan -> implement*)* -> review -> merge


# The tier menu is config.tiers.keys() (always low/medium/high in this design).
# `code-reviewer` carries the cross-vendor diversity guarantee via
# `differ_from: task-lead` — the implementer subagent is dispatched by
# `task-lead`, so the final code reviewer differs from the task-lead's
# resolved (provider, model). Subagent dispatch (`task` tool) has no
# diversity guarantee — accepted limitation (spec §11).

vars:
  ready_to_merge:         {type: bool, default: false}
  final_review:           {type: bool, default: true}
  fast_path:              {type: bool, default: false}
  spec_final_review_done: {type: bool, default: false}
  plan_final_review_done: {type: bool, default: false}

defaults:
  max_retries: 3
  max_loops: 1000
  max_tool_calls: 10000

phases:
  - name: spec
    steps:
      - name: spec-writer
        file: agents/spec-writer.md
        tier: high
        interactive: true
        fs_permissions:
          - {operations: [read],  paths: ["/project/**"], mode: allow}
          - {operations: [write], paths: ["/project/imp/specs/**"], mode: allow}
          - {operations: [write], paths: ["/**"], mode: deny}
        rules:
          - {if: {phase: drafting}, resume: spec-writer}    # used for rename at step boundary
          - {else: true, set: {fast_path: "output.complexity == 'trivial'"}, continue: true}

      - name: spec-verify-commit
        command: ./scripts/spec-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: spec-writer}

      - name: spec-final-review-gate   # self-consuming flag; ordered FIRST
        rules:
          - {if: {spec_final_review_done: true}, set: {spec_final_review_done: false}, goto: plan-writer}
          - {else: true, continue: true}

      - name: fast-path-spec-gate      # trivial change -> skip spec review entirely
        rules:
          - {if: {fast_path: true}, goto: plan-writer}
          - {else: true, continue: true}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        rules:
          - {if: {blocking: true}, resume: spec-writer, feedback: "Here's review feedback to address:"}                            # rework loop
          - {else: true, set: {spec_final_review_done: true}, resume: spec-writer, feedback: "The spec was approved. Notes for a final polish pass:"} # clean -> one final polish pass

  - name: plan
    steps:
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["/project/**"], mode: allow}
          - {operations: [write], paths: ["/project/imp/plans/**"], mode: allow}
          - {operations: [write], paths: ["/**"], mode: deny}

      - name: plan-verify-commit
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

      - name: plan-final-review-gate   # self-consuming flag; ordered FIRST (mirrors spec phase)
        rules:
          - {if: {plan_final_review_done: true}, set: {plan_final_review_done: false}, goto: task-lead}
          - {else: true, continue: true}

      - name: fast-path-plan-gate      # moved after the final-review gate
        rules:
          - {if: {fast_path: true}, goto: task-lead}   # skip plan-review on fast-path
          - {else: true, continue: true}

      - name: plan-review
        file: agents/plan-reviewer.md
        tier: high
        rules:
          - {if: {blocking: true}, resume: plan-writer, feedback: "Here's review feedback to address:"}                            # rework loop
          - {else: true, set: {plan_final_review_done: true}, resume: plan-writer, feedback: "The plan was approved. Notes for a final polish pass:"} # clean -> one final polish pass

  - name: implement
    steps:
      - name: task-lead
        file: agents/task-lead.md
        tier: medium
        fs_permissions:
          - {operations: [read],  paths: ["/project/**"], mode: allow}
          # implementer subagent inherits these. /project/** covers both code and
          # /project/.imp/change/progress.md (** matches dotdirs, permissions.py:34-35).
          - {operations: [write], paths: ["/project/**"], mode: allow}
          - {operations: [write], paths: ["/**"], mode: deny}   # no writes outside /project
        rules:
          - {if: {deviation: true}, resume: plan-writer, feedback: "The plan didn't match the codebase. Here's what the implementer found:"}    # plan was wrong
          - {if: {done: false},     goto: task-lead}        # next task, fresh
          - {else: true, continue: true}                    # plan implemented

      - name: commit-check
        command: ./scripts/implement-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: task-lead}   # clean tree / trailers / 1-commit-per-task

      - name: run-tests
        command: ./scripts/run-tests.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: task-lead}   # carries test stderr as feedback

      - name: fast-path-cycle-gate
        rules:
          - {if: {fast_path: true}, goto: review}       # straight to autosquash/code-review
          - {else: true, continue: true}

      - name: plan-cycle-check
        file: agents/plan-cycle-check.md
        tier: medium
        max_loops: 10                # plans-per-spec bound
        rules:
          - {if: {more_plans: true}, goto: plan-writer, feedback: "More plans are needed for this spec. Coverage assessment:"}     # supercycle
          - {else: true, continue: true}

  - name: review
    steps:
      - name: autosquash
        command: ./scripts/autosquash.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}   # rebase conflict → human resolves

      - name: stamp-trailers
        command: ./scripts/stamp-trailers.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}   # self-verify failed → human resolves

      - name: code-reviewer
        file: agents/code-reviewer.md
        tier: high
        differ_from: task-lead
        max_loops: 5                 # combined task_gap + plan_gap budget
        rules:
          - {if: {verdict: task_gap}, goto: implement, feedback: "The code reviewer found gaps to fix. Findings:"}      # carries findings
          - {if: {verdict: plan_gap}, goto: plan-writer, feedback: "The code reviewer found the plan needs revision. Findings:"}    # carries findings
          - {else: true, continue: true}                    # approve

      - name: summarizer
        file: agents/summarizer.md
        tier: high

      - name: final-review-gate
        rules:
          - {if: {final_review: false}, set: {ready_to_merge: true}, goto: merge}
          - {else: true, continue: true}

      - name: final-review
        file: agents/final-review.md
        tier: medium
        interactive: true
        max_loops: 20                # interactive back-to-implement edge
        rules:
          - {if: {decision: merge},  set: {ready_to_merge: true}, continue: true}
          - {if: {decision: rework}, goto: implement, feedback: "Here's the feedback to address:"}        # carries comments
          - {else: true, pause: true}

  # ── merge ───────────────────────────────────────────────────────────
  - name: merge
    steps: []
