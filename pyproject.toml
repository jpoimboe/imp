[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp"
version = "0.0.1"
description = "Project-local development lifecycle tool"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "filelock>=3.13",
  "anyio>=4.0,<5.0",
  "anthropic>=0.40,<1.0",
  "openai>=1.50,<3.0",
  "claude-agent-sdk>=0.2.87,<1.0",
  "openai-codex-sdk==0.1.11",
  "httpx>=0.27",
  "prompt_toolkit>=3.0,<4.0",
  "rich>=13.0,<15.0",
  "markdown-it-py>=3.0,<5.0",
  "pyte>=0.8,<0.9",
  "pillow>=10.0",
  "fonttools>=4.0",
  "mcp>=1.27,<2.0",
  "tree-sitter-language-pack>=1.10,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.5",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
imp = "imp.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imp", "src/impty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
timeout = 60
timeout_method = "signal"
markers = [
    "real_sandbox_policy: opt out of the no-bwrap sandbox fallback fixture (tests asserting the raw sandbox posture)",
    "codex_parallel: codex parallel-MCP-dispatch concurrency probe; XFAIL on codex builds that serialize MCP sub_agent dispatch. Deselected from the default test-live via -m 'not codex_parallel'; run on demand with `make test-live-codex-parallel`.",
]
filterwarnings = [
    # Allowlist posture: EVERY warning is an error, so first-party mistakes —
    # bad test collection, our own deprecations, any newly-introduced warning —
    # fail the run instead of scrolling past unseen. The carve-outs below are
    # the only exceptions, each justified.
    "error",
    # ResourceWarning is a deferred backlog. The bulk are unclosed anyio/asyncio
    # streams raised from third-party close sites during GC, which filterwarnings
    # can't attribute back to imp — so we can't error on "just ours" without
    # also failing on third-party leaks. Kept ignored until the leaks are chased
    # down. A few DO originate in first-party code (src/imp/cli/remote_channel.py,
    # tests/impty/test_render.py) and are worth fixing at the source separately.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # Third-party, not fixable here: uvicorn imports deprecated websockets.legacy,
    # pulled in transitively by the codex SDK test server. Re-evaluate on a
    # uvicorn / codex-SDK bump.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
    "ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Throwaway de-risking spikes are preserved as reference artifacts, not
# maintained code — don't hold them to lint standards (keeps `make lint` and the
# workflow's pre-commit lint gate green; mypy already only checks `src/`).
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# ❯ (U+276F) is the intentional prompt caret (palette.CARET) and › (U+203A) is the
# phase/step divider glyph; × (U+00D7) is the warnings-summary repeat-count multiplier
# (e.g. "×2"); ℹ (U+2139) prefixes the `imp new` base-resolution notice; all read as
# confusables but are deliberate UI glyphs (RUF001-003).
allowed-confusables = ["❯", "›", "×", "ℹ"]

[tool.ruff.lint.isort]
known-first-party = ["imp", "impty"]

[tool.ruff.lint.per-file-ignores]
"tests/test_types.py" = ["F401"]  # imports verify public API surface, not all are used inline

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

# The codex provider SDK is an optional runtime dependency (guarded by
# try/except ImportError); it is not installed in the dev/test env, so mypy
# can't resolve it. Treat it as a missing import rather than a hard error.
[[tool.mypy.overrides]]
module = ["openai_codex_sdk", "openai_codex_sdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyte.*"
ignore_missing_imports = true

# fontTools ships no py.typed marker; impty.render uses it only to read a font's
# cmap for the glyph-fallback chain. Treat it as a missing import.
[[tool.mypy.overrides]]
module = "fontTools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_language_pack.*"
ignore_missing_imports = true
