[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp"
version = "0.0.1"
description = "Project-local development lifecycle tool"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "filelock>=3.13",
  # Plan 2 additions — versions resolved by Task 1 install. Pin major only.
  "deepagents>=0.6,<0.7",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "langchain-anthropic>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
imp = "imp.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["imp"]

[tool.ruff.lint.per-file-ignores]
"tests/test_types.py" = ["F401"]  # imports verify public API surface, not all are used inline

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
