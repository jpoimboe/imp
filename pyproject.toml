[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp"
version = "0.0.1"
description = "Project-local development lifecycle tool"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "filelock>=3.13",
  "anyio>=4.0,<5.0",
  "anthropic>=0.40,<1.0",
  "openai>=1.50,<3.0",
  "claude-agent-sdk>=0.2.87,<1.0",
  "openai-codex-sdk==0.1.11",
  "httpx>=0.27",
  "prompt_toolkit>=3.0,<4.0",
  "rich>=13.0,<15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
imp = "imp.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["imp"]

[tool.ruff.lint.per-file-ignores]
"tests/test_types.py" = ["F401"]  # imports verify public API surface, not all are used inline

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
