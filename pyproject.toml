[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imp"
version = "0.0.1"
description = "A development process that runs itself: one intent in, a reviewed and merged change out"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "agents", "coding-agent", "llm", "claude", "codex", "workflow", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyyaml>=6.0.3",
  "ruamel.yaml>=0.19.1",
  "jinja2>=3.1.6",
  "pydantic>=2.13.5",
  "filelock>=4.0.0",
  "anyio>=4.15.1,<5.0",   # open_process(pass_fds=…) — the namespace-join spawn needs it
  "anthropic>=1.6.0,<2.0",
  "openai>=3.14.1,<4.0",
  "claude-agent-sdk>=0.2.154,<1.0",
  "httpx>=0.28.1",
  "prompt_toolkit>=3.0.53,<4.0",
  "rich>=15.0.0,<16.0",
  "markdown-it-py>=4.2.0,<5.0",
  "pyte>=0.8.2,<0.9",
  "pillow>=12.3.0",
  "fonttools>=4.65.0",
  # Stays on 1.x: 2.0 renames FastMCP to MCPServer and moves the tool-manager
  # internals codex_mcp.py registers through. 1.x still gets security fixes.
  "mcp>=1.30.0,<2.0",
  "tree-sitter-language-pack>=1.20.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-mock>=3.15.1",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.8",
  "mypy>=2.3.1",
  "types-PyYAML>=6.0.12.20260906",
  "build>=1.6.1",
  "hatchling>=1.33.0",
]

[project.scripts]
imp = "imp.__main__:main"

[project.urls]
Homepage = "https://github.com/jpoimboe/imp"
Repository = "https://github.com/jpoimboe/imp"
Documentation = "https://github.com/jpoimboe/imp/tree/master/docs"
Issues = "https://github.com/jpoimboe/imp/issues"

# hatchling's default does not skip .imp/ (imp's quest state); without this the sdist carries it.
# /imp (imp's own dogfood config) must go too, and skip-excluded-dirs must be on for it to
# work: imp/workflows/default is a SYMLINK to src/imp/assets/workflows/default, and hatchling
# walks with followlinks=True while skipping any directory whose (st_dev, st_ino) it already
# visited. Excluding a path only filters files by default -- the directory is still walked --
# so imp/ (sorting before src/) was traversed first and the real package copy was then skipped
# as already-seen, silently dropping the whole default workflow from the sdist and from any
# wheel built off it. skip-excluded-dirs prunes imp/ from the walk instead, so the real copy
# is the one that gets seen. /imp is anchored with a leading slash so it cannot match src/imp.
[tool.hatch.build.targets.sdist]
exclude = [".imp", "/imp"]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/imp", "src/impty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
timeout = 60
timeout_method = "signal"
# Keep tmp_path dirs only for failing tests. A full run leaves ~136k inodes
# across ~17k tmp_path dirs; the default (retain all, last 3 runs) multiplied
# by every concurrent sandbox's private /tmp exhausts tmpfs's 1M inode cap.
tmp_path_retention_policy = "failed"
markers = [
    "real_sandbox_policy: opt out of the no-bwrap sandbox fallback fixture (tests asserting the raw sandbox posture)",
    "bare_sandbox: force the executor sandbox policy inactive (run gates bare) even on a bwrap host — for run_quest gate-routing tests whose intent is routing, not sandboxing, so they never flake on a transient bwrap spawn failure",
    "codex_parallel: codex parallel-MCP-dispatch concurrency probe; XFAIL on codex builds that serialize MCP sub_agent dispatch. Deselected from the default test-live via -m 'not codex_parallel'; run on demand with `make test-live-codex-parallel`.",
    "live: test needing a real provider toolchain — an API round-trip, or just the provider's CLI binary. Gated behind --run-live; the positional arg names the provider (anthropic|openai|claude|codex). See tests/_live.py.",
]
filterwarnings = [
    # Allowlist posture: EVERY warning is an error, so first-party mistakes —
    # bad test collection, our own deprecations, any newly-introduced warning —
    # fail the run instead of scrolling past unseen. The carve-outs below are
    # the only exceptions, each justified.
    "error",
    # ResourceWarning is a deferred backlog. The bulk are unclosed anyio/asyncio
    # streams raised from third-party close sites during GC, which filterwarnings
    # can't attribute back to imp — so we can't error on "just ours" without
    # also failing on third-party leaks. Kept ignored until the leaks are chased
    # down. A few DO originate in first-party code (src/imp/cli/remote_channel.py,
    # tests/impty/test_render.py) and are worth fixing at the source separately.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# ❯ (U+276F) is the intentional prompt caret (palette.CARET) and › (U+203A) is the
# phase/step divider glyph; × (U+00D7) is the warnings-summary repeat-count multiplier
# (e.g. "×2"); ℹ (U+2139) prefixes the `imp new` base-resolution notice; all read as
# confusables but are deliberate UI glyphs (RUF001-003).
allowed-confusables = ["❯", "›", "×", "ℹ"]

[tool.ruff.lint.isort]
known-first-party = ["imp", "impty"]

[tool.ruff.lint.per-file-ignores]
"tests/test_types.py" = ["F401"]  # imports verify public API surface, not all are used inline

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "pyte.*"
ignore_missing_imports = true

# fontTools ships no py.typed marker; impty.render uses it only to read a font's
# cmap for the glyph-fallback chain. Treat it as a missing import.
[[tool.mypy.overrides]]
module = "fontTools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tree_sitter_language_pack.*"
ignore_missing_imports = true
