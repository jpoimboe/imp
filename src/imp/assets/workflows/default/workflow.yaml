name: feature
description: |
  spec -> (plan -> implement*)* -> review -> merge


# The tier menu is config.tiers.keys() (always low/medium/high in this design).
# Single provider by design: review independence is by MODEL TIER (an opus panel
# reviewing sonnet's work), not by vendor. `differ_from` is removed from the
# review phase. The `review-panel` step is a sonnet coordinator that dispatches a
# four-member opus discovery panel ONCE (guarded by `panel_done`); the `recheck`
# step is a sonnet generalist re-review loop that iterates until clean. The opus
# panel runs only on substantive changes: a `fast_path` (trivial) change skips it
# at `panel-gate` and gets just the one cheap sonnet `recheck` whole-diff review.

vars:
  ready_to_merge:         {type: bool, default: false}
  final_review:           {type: bool, default: true}
  fast_path:              {type: bool, default: false}
  spec_minors_integrated: {type: bool, default: false}
  plan_minors_integrated: {type: bool, default: false}
  panel_done:             {type: bool, default: false}
  integration_needs_review: {type: bool, default: false}
  spec_confirm:           {type: bool, default: true}    # confirm-gate enable
  spec_unseen_changes:    {type: bool, default: false}   # some turn changed the spec without user direction
  spec_gate_pending:      {type: bool, default: false}   # a confirm resume is in flight (one-shot grant)
  spec_gate_passed:       {type: bool, default: false}   # gated confirm accepted; route past review (one-shot)

defaults:
  max_retries: 3
  max_loops: 1000
  max_tool_calls: 10000

phases:
  - name: spec
    steps:
      - name: spec-writer
        file: agents/spec-writer.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["imp/specs/**"], mode: allow}
        rules:
          - {if: {phase: confirmed, spec_gate_pending: true, unseen_changes: false},
             set: {spec_gate_pending: false, spec_gate_passed: true}, continue: true}
          - {else: true,
             set: {spec_gate_pending: false, spec_gate_passed: false,
                   fast_path: "output.complexity == 'trivial'",
                   spec_unseen_changes: "spec_unseen_changes or unseen_changes"},
             continue: true}

      - name: spec-verify-commit
        quiet: true
        command: ./scripts/spec-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, set: {spec_gate_passed: false}, resume: spec-writer}

      - name: spec-exit-gate           # spec-phase exit router: gated-confirm pass-through, trivial skip, else continue to review
        quiet: true
        rules:
          - {if: {spec_gate_passed: true}, set: {spec_gate_passed: false}, goto: plan-writer}
          - {if: {fast_path: true}, set: {spec_unseen_changes: false}, goto: plan-writer}
          - {else: true, continue: true}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        # The reviewer gets the last word: the loop ends only on a clean review with
        # nothing left to integrate. spec_minors_integrated tracks whether the writer
        # has already spent its one minors-integration pass for the current settled
        # state — so a clean *verification* review stops and drops its own minors.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {spec_minors_integrated: false},
             resume: spec-writer, feedback: "Here's review feedback to address:"}
          # Clean verification review after a minors pass, armed -> confirm gate (if enabled).
          - {if: {spec_minors_integrated: true, spec_confirm: true, spec_unseen_changes: true},
             set: {spec_minors_integrated: false, spec_unseen_changes: false, spec_gate_pending: true},
             resume: spec-writer, feedback: &confirm_fb "The review cycle is complete and the spec is accepted. Surface any significant decisions made during review to the user and confirm before finalizing:"}
          # Clean verification review, gate disabled or unarmed -> proceed.
          - {if: {spec_minors_integrated: true},
             set: {spec_minors_integrated: false, spec_unseen_changes: false}, goto: plan-writer}
          # Clean with actionable minors -> minors pass; arming happens via the writer's unseen_changes.
          - {if: {has_minor_findings: true}, set: {spec_minors_integrated: true},
             resume: spec-writer, feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean, no minors, but the cycle changed the spec -> confirm gate (if enabled).
          - {if: {spec_confirm: true, spec_unseen_changes: true},
             set: {spec_unseen_changes: false, spec_gate_pending: true},
             resume: spec-writer, feedback: *confirm_fb}
          # Clean first pass, nothing changed since the brainstorm -> proceed.
          - {else: true, set: {spec_unseen_changes: false}, goto: plan-writer}

  - name: plan
    steps:
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["imp/plans/**"], mode: allow}

      - name: plan-verify-commit
        quiet: true
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

      - name: fast-path-plan-gate      # trivial change -> skip plan review entirely
        quiet: true
        rules:
          - {if: {fast_path: true}, goto: task-lead}   # skip plan-review on fast-path
          - {else: true, continue: true}

      - name: plan-review
        file: agents/plan-reviewer.md
        tier: high
        # Mirrors spec-reviewer: the reviewer gets the last word. plan_minors_integrated
        # tracks whether the writer has already spent its one minors-integration pass.
        rules:
          # Critical/Major -> rework, then re-review. Clear the flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {plan_minors_integrated: false}, resume: plan-writer, feedback: "Here's review feedback to address:"}
          # Clean, and the writer already did its minors-integration pass -> stop; drop this review's minors.
          - {if: {plan_minors_integrated: true}, set: {plan_minors_integrated: false}, goto: task-lead}
          # Clean with actionable minors -> integrate them, then owe one more (verification) review.
          - {if: {has_minor_findings: true}, set: {plan_minors_integrated: true}, resume: plan-writer, feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean, nothing to integrate -> stop.
          - {else: true, goto: task-lead}

  - name: implement
    steps:
      - name: task-lead
        file: agents/task-lead.md
        tier: medium
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          # implementer subagent inherits these. ** covers code and
          # .imp/change/progress.md (** matches dotdirs, permissions.py:34-35).
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {if: {deviation: true}, resume: plan-writer, feedback: "The plan didn't match the codebase. Here's what the implementer found:"}    # plan was wrong
          - {if: {done: false},     goto: task-lead}        # next task, fresh
          - {else: true, continue: true}                    # plan implemented

      - name: commit-check
        quiet: true
        command: ./scripts/implement-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: task-lead}   # clean tree / trailers / 1-commit-per-task

      - name: run-tests
        command: ./scripts/run-tests.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: task-lead}   # carries test stderr as feedback

      - name: fast-path-cycle-gate
        quiet: true
        rules:
          - {if: {fast_path: true}, goto: review}       # straight to autosquash/review
          - {else: true, continue: true}

      - name: plan-cycle-check
        file: agents/plan-cycle-check.md
        tier: medium        # Sonnet coverage judgment
        max_loops: 10                # plans-per-spec bound
        rules:
          - {if: {more_plans: true}, goto: plan-writer, feedback: "More plans are needed for this spec. Coverage assessment:"}     # supercycle
          - {else: true, continue: true}

  - name: review
    steps:
      - name: autosquash
        quiet: true
        command: ./scripts/autosquash.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}   # rebase conflict → human resolves

      - name: stamp-trailers
        quiet: true
        command: ./scripts/stamp-trailers.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}   # self-verify failed → human resolves

      - name: panel-gate           # guard the opus panel: skip it on re-entry AND on fast-path
        quiet: true
        rules:
          - {if: {panel_done: true}, goto: recheck}         # panel already ran -> sonnet re-check only
          - {if: {fast_path: true}, goto: recheck}          # trivial change -> skip the opus panel; one cheap sonnet whole-diff recheck still runs
          - {else: true, continue: true}

      - name: review-panel         # opus discovery panel behind a sonnet coordinator; runs ONCE
        file: agents/review-panel.md
        tier: medium               # sonnet coordinator (mechanical collapse, not judgment)
        rules:
          - {if: {verdict: task_gap}, set: {panel_done: true}, goto: implement, feedback: "The review panel found gaps to fix. Findings:"}
          - {if: {verdict: plan_gap}, set: {panel_done: true}, goto: plan-writer, feedback: "The review panel found the plan needs revision. Findings:"}
          - {else: true, set: {panel_done: true}, goto: integrate-merge}   # approve -> integrate (was: summarizer)

      - name: recheck              # sonnet verification loop (reuses the generalist prompt)
        file: agents/code-reviewer.md
        tier: medium
        max_loops: 5                 # combined task_gap + plan_gap budget
        rules:
          - {if: {verdict: task_gap}, goto: implement, feedback: "The code reviewer found gaps to fix. Findings:"}      # carries findings
          - {if: {verdict: plan_gap}, goto: plan-writer, feedback: "The code reviewer found the plan needs revision. Findings:"}    # carries findings
          - {else: true, continue: true}                    # approve

      # ── integrate base into the branch, before review folds into one decision ──
      - name: integrate-merge        # B2: merge base into the branch, uncommitted
        quiet: true                  # mechanical; the integrator/integration-review agents narrate
        command: ./scripts/integrate-merge.sh
        rules:
          - {if: {exit: 2}, goto: summarizer}     # base already integrated -> skip integration
          - {if: {exit: 0}, continue: true}        # clean or conflicted tree -> integrator
          - {else: true, pause: true}              # exit 3 (bad base ref, R7) / exit 5 (dirty entry or merge refusal) [exit 4 re-integration limit added in B3]

      - name: integrator             # B2: resolve textual+semantic conflicts, commit a clean merge
        file: agents/integrator.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          # R4: the integrator is the writer of integration_needs_review, set BOTH
          # ways every round (a clean round after a flagged one resets it).
          - {if: {integration: review}, set: {integration_needs_review: true}, continue: true}
          - {else: true, set: {integration_needs_review: false}, continue: true}

      - name: integrate-tests        # B2: reuse the wired IMP_TEST_COMMAND
        command: ./scripts/run-tests.sh
        max_loops: 5                 # bound the integrator<->tests bounce (default is 1000)
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: integrator}       # post-merge failure (often IS the semantic conflict)

      - name: integration-review     # B2/F2: review the integrator's resolutions (purpose-written reviewer)
        file: agents/integration-reviewer.md
        tier: high
        max_loops: 5
        rules:
          - {if: {verdict: task_gap}, resume: integrator, feedback: "Integration review found gaps in the merge resolution. Findings:"}
          - {if: {verdict: plan_gap}, resume: integrator, feedback: "Integration review flagged a deeper issue with the merge. Findings:"}
          - {else: true, continue: true}            # approve

      - name: summarizer
        file: agents/summarizer.md
        tier: high

      - name: final-review-gate
        quiet: true
        rules:
          - {if: {final_review: false}, set: {ready_to_merge: true}, goto: merge}
          - {if: {ready_to_merge: true, integration_needs_review: false}, goto: merge}   # C2.1: approved + clean reviewed re-integration -> skip re-review
          - {else: true, continue: true}

      - name: final-review
        file: agents/final-review.md
        tier: medium
        max_loops: 20
        rules:
          - {if: {decision: merge},  set: {ready_to_merge: true}, continue: true}
          - {if: {decision: rework}, goto: implement, feedback: "Here's the feedback to address:"}        # carries comments
          - {else: true, pause: true}

  # ── merge ───────────────────────────────────────────────────────────
  - name: merge
    steps:
      - name: base-fresh-check       # B3: cheap pre-lock freshness fast-path
        quiet: true
        command: ./scripts/base-fresh-check.sh
        rules:
          - {if: {exit: 0}, continue: true}          # base unchanged / not-integrated -> take the lock
          - {if: {exit: 10}, goto: integrate-merge}  # base advanced -> re-integrate
          - {else: true, pause: true}                # exit 1 preamble failure -> human

      - name: merge-to-base          # B3: engine-native, lock-protected, routable
        kind: merge
        rules:
          - {if: {merge: STALE}, goto: integrate-merge}   # base moved between check and lock -> re-integrate
          - {if: {merge: MERGED}, continue: true}          # falls through to _complete finalize
          - {else: true, pause: true}                      # defensive fallback; _route_merge intercepts CONFLICT/REFUSED/DIRTY first to emit merge_blocked + a reasoned pause
