description: |
  threshold -> spec -> (plan -> implement)* -> converge -> integrate

# Single provider by design: review independence is by MODEL TIER (a high-tier
# reviewer judging the coder's work), not by vendor. The per-plan implement loop
# carries NO code review and NO sweep: each plan's tasks are implemented and
# fast-verified, then check-next-plan either starts the next outline plan or
# (last plan done) enters converge. converge runs ONCE per quest: gap-check (the
# sole coverage backstop; latches coverage_settled) -> quest-review (the single
# quest-wide code review, reusing agents/batch-code-reviewer.md) -> deferred-check
# (skips the sweep when there is nothing to drain) -> deferred-sweep (drains the
# whole quest's Deferred list once) -> converge-verify (slow, on the
# quest's own base). integrate then
# acquires the merge lane, rebases, slow-re-verifies only when the base moved,
# reviews the integration, check-cleared re-checks tree clearance (re-gates if
# this tree was never verified), and ends at the human gate (summarizer ->
# finalize) so the human blesses the locked, rebased, slow-tested state.
# cleanup.sh folds fixups and stamps the Quest: trailer once, over
# cur_base_head..HEAD.

vars:
  fast_path:              {type: bool, default: false}
  auto_merge:             {type: bool, default: true}
  coverage_settled:       {type: bool, default: false}
  plan_review_notes:      {type: string, default: ""}
  integration_fork:       {type: string, default: ""}
  slow_verify_tolerated:  {type: bool, default: false}
  plan_index:             {type: int, default: 1}
  plan_total:             {type: int, default: 1}
  task_total:             {type: int, default: 0}

defaults:
  max_retries: 3
  max_loops: 10
  max_tool_calls: 10000

phases:
  # ── threshold: phase 0, a bare conversation (show_label:false). It answers
  # questions, scouts existing work, or scopes a build; on go-live it sets the
  # ceremony and routes into the pipeline. express skips spec finalization and
  # review, but spec-written still gates and announces the drafted spec; full
  # enters spec-finalizer for adopt-with-light-review.
  - name: threshold
    show_label: false
    steps:
      - name: threshold
        file: agents/threshold.md
        tier: high
        interactive: true
        rules:
          - {if: {ceremony: express}, set: {fast_path: true}, goto: scope-code-check}
          - {else: true, set: {fast_path: false}, goto: scope-code-check}

      - name: scope-code-check
        show_label: false
        command: ./scripts/scope-code-check.sh
        # The express exit-0 goto hops to spec-written bare; the full exit-0 goto forwards
        # its configured `feedback:` (the hand-off opener) to spec-finalizer. The dirty
        # (exit != 0) resume carries no feedback:, so the engine delivers the script's own
        # stderr to the resumed threshold turn.
        rules:
          - {if: {exit: 0, fast_path: true}, goto: spec-written}
          - {if: {exit: 0}, goto: spec-finalizer, label: "writing spec", feedback: "Adopt the spec drafted with the user and finalize it:"}
          - {else: true, resume: threshold, label: "undoing code committed during scoping"}

      # Express only: the drafted spec must be on disk before planning; its stdout is the
      # marker. The exit-0 goto forwards the plan-writer hand-off opener; the missing-spec
      # resume carries no feedback:, so the engine delivers the script's stderr to threshold.
      - name: spec-written
        show_label: false
        show_output: true
        command: ./scripts/spec-written.sh
        rules:
          - {if: {exit: 0}, goto: plan-writer, label: "writing plan", feedback: "Plan this from the spec drafted with the user:"}
          - {else: true, resume: threshold, label: "writing the missing spec"}

  - name: spec
    label: "spec phase"
    steps:
      - name: spec-finalizer
        file: agents/spec-finalizer.md
        tier: high
        label: finalizing spec
        rules:
          - {else: true, continue: true}

      # The gate counts the spec's ## Plan outline, so the planning label carries the
      # real denominator before plan-writer starts. required: false keeps the failure
      # branches routing (the script seeds {} in $IMP_OUTPUT) instead of pausing.
      - name: spec-verify-commit
        show_label: false
        command: ./scripts/spec-commit-verify.sh
        output:
          plan_total: {type: int, required: false}
        rules:
          - {if: {exit: 0}, set: {plan_total: output.plan_total}, continue: true}
          - {else: true, resume: spec-finalizer, label: "fixing the spec file"}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        label: reviewing spec
        read_only: ["."]
        rules:
          - {if: "output.critical + output.major > 0",
             resume: spec-finalizer, label: "addressing spec review feedback",
             feedback: "Here's review feedback to address:"}
          - {else: true, goto: plan-writer, label: "writing plan",
             feedback: "The spec is approved — no blocking issues. Plan it. Any Minor findings below are advisory: fold in what improves the plan, and do not rewrite the spec for them:"}

  - name: plan
    label: "planning phase · plan {{ vars.plan_index }}/{{ vars.plan_total }}"
    steps:
      # plan-writer is the plan-phase entry: the spec phase routes here, and supercycle/rework goto plan-writer directly.
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        label: "writing plan"
        rules:
          - {else: true, continue: true}

      - name: plan-verify-commit
        show_label: false
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: plan-finalized}   # trivial quest: skip plan review entirely
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer, label: "writing the missing plan"}

      - name: plan-reviewer
        file: agents/plan-reviewer.md
        tier: high
        label: "reviewing plan"
        read_only: ["."]
        # A single plan-reviewer runs directly as the step at its own high tier (the
        # prior medium tier was only the coordinator's dispatch-and-collapse cost); the
        # engine routes its {status, findings, critical, major, minor} output
        # through these rules.
        rules:
          - {if: "output.critical + output.major > 0", resume: plan-writer,
             label: "addressing plan review feedback",
             feedback: "Here's review feedback to address:"}
          - {else: true, set: {plan_review_notes: "output.findings"}, goto: plan-finalized}

      - name: plan-finalized
        label: "finalizing plan"
        command: ./scripts/plan-finalized.sh {{ vars.plan_index }} {{ vars.plan_total }}
        show_output: true
        output:
          task_total: {type: int}
        rules:
          - {else: true, set: {task_total: output.task_total}, goto: task-lead}

  - name: implement
    label: "implementation phase · plan {{ vars.plan_index }}/{{ vars.plan_total }}"
    steps:
      - name: task-lead
        position_label: true
        file: agents/task-lead.md
        tier: high
        label: "task 1/{{ vars.task_total }}"
        rotate_phrase: true
        rules:
          - {if: {verify_tolerated: true}, goto: check-next-plan}
          - {else: true, continue: true}

      - name: verify
        command: ./scripts/run-verify.sh fast
        interruptible: true
        acquire: test-lane
        label: running tests
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: task-lead, label: "fixing test failures"}

      # Routing-only branch. After a plan's tasks settle:
      #  - a converge/finalize rework (coverage_settled latched) -> quest-review (re-review, never re-gap-check);
      #  - more outline plans remain -> the next plan-writer (plan_index++);
      #  - the last outline plan was implemented -> the once-only gap-check (enter converge).
      - name: check-next-plan
        show_label: false
        rules:
          - {if: {coverage_settled: true}, goto: quest-review}
          - {if: "var.plan_index < var.plan_total", set: {plan_index: "var.plan_index + 1"}, goto: plan-writer, progress: true, label: "writing plan"}
          - {else: true, goto: gap-check}

  # ── converge: runs ONCE per quest (quest-local, NO lock). The coverage backstop,
  # the single quest-wide code review, the deferred sweep when there is anything to
  # drain, and the slow verify on the quest's own base.
  - name: converge
    label: "convergence phase"
    steps:
      # End-of-quest coverage backstop — runs ONCE. Gap found -> author a corrective via
      # plan-writer (latch stays false). Clean -> latch coverage_settled and run the
      # quest-wide review.
      - name: gap-check
        file: agents/gap-check.md
        tier: high
        label: checking plan coverage
        rules:
          - {if: {more_plans: true}, set: {plan_total: "output.plan_total", plan_index: "var.plan_index + 1"}, goto: plan-writer, label: "writing plan for coverage gaps", feedback: "More plans are needed for this spec. Coverage assessment:"}
          - {else: true, set: {coverage_settled: true}, goto: quest-review}

      # The single quest-wide code review (cur_base_head..HEAD), reusing batch-code-reviewer.md.
      # approve -> deferred-check (the sweep's guard); task_gap -> task-lead rework.
      - name: quest-review
        file: agents/batch-code-reviewer.md
        tier: high
        label: reviewing entire diff
        read_only: ["."]
        rules:
          # Clear the one-hop carrier (the quoted '' is load-bearing: a set: RHS is an expression).
          - {if: {verdict: task_gap}, set: {plan_review_notes: "''"}, goto: task-lead,
             label: "addressing code review feedback",
             feedback: "The batch-code-reviewer found an implemented task needs rework. Findings:"}
          - {if: {status: Error}, pause: true}
          - {else: true, goto: deferred-check}

      # Guard: the sweep is a high-tier agent dispatch, so skip it when the quest's
      # Deferred Followups list has nothing to drain. Fails closed — exit 1 is the
      # only skip signal; any error exits 0 and dispatches. converge-verify's failure
      # rule names deferred-sweep directly, so slow-gate triage jumps this guard.
      - name: deferred-check
        show_label: false
        command: ./scripts/deferred-check.sh
        rules:
          - {if: {exit: 1}, goto: converge-verify}
          - {else: true, continue: true}

      - name: deferred-sweep
        file: agents/deferred-sweep.md
        tier: high
        label: sweeping deferred tasks
        rules:
          - {if: {converge_verify_tolerated: true}, set: {slow_verify_tolerated: true}, goto: wait-for-head}
          - {else: true, continue: true}

      # Slow tests on the quest's own base (off-lock). Clean -> enter integrate. A failure
      # resumes deferred-sweep in slow-gate triage: a fix loops back through converge-verify;
      # a "not ours" toleration emits converge_verify_tolerated
      # -> wait-for-head (forward escape; this gate never re-runs).
      - name: converge-verify
        command: ./scripts/run-verify.sh slow
        interruptible: true
        acquire: test-lane
        label: running tests
        rules:
          - {if: {exit: 0}, goto: wait-for-head}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: deferred-sweep, label: "triaging slow test failures", feedback: "The slow verify gate (converge-verify) failed. Triage fix-vs-tolerate:"}

  # ── integrate: the FIFO merge queue (base lock from wait-for-head). Rebase, slow
  # re-verify only when the base moved, review the integration, then the human gate.
  - name: integrate
    label: "integration phase"
    steps:
      - name: wait-for-head
        acquire: merge-lane
        label: waiting in merge queue
        rules:
          - {else: true, continue: true}

      - name: integrate-rebase
        show_label: false
        command: ./scripts/integrate-rebase.sh "{{ vars.slow_verify_tolerated }}"
        rules:
          - {if: {exit: 2}, goto: summarizer}
          - {if: {exit: 0}, set: {integration_fork: output.stdout}, goto: validate-memory}
          - {if: {exit: 7}, set: {integration_fork: output.stdout}, goto: validate-memory}
          - {if: {exit: 6}, set: {integration_fork: output.stdout}, continue: true}
          - {else: true, pause: true}

      - name: reconciler
        file: agents/reconciler.md
        tier: high
        label: resolving merge conflicts
        rules:
          - {if: {stuck: true}, pause: true}
          - {else: true, continue: true}

      # Post-rebase memory gate: re-runs imp's own load-time memory validation over
      # the fully-merged worktree (quest changes + latest base) against the rebased
      # workflow defs. Byte-identical command to the memory workflow's gate.
      - name: validate-memory
        show_label: false
        command: python3 -m imp.providers.validate_memory_cli "$IMP_PROJECT_ROOT"
        max_loops: 6
        rules:
          - {if: {exit: 0}, goto: integration-verify}
          - {else: true, resume: reconciler, label: "fixing memory files",
             feedback: "The imp/memory/ tree is invalid against the rebased workflows. Fix the memory file paths:"}

      - name: integration-verify
        command: ./scripts/run-verify.sh slow
        interruptible: true
        acquire: test-lane
        label: running tests
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, goto: integration-reviewer, feedback: "Integration tests failed on the merged tree. Adjudicate fix-vs-tolerate:"}

      - name: integration-reviewer
        file: agents/integration-review.md
        tier: high
        label: reviewing merge
        rules:
          - {if: "output.critical + output.major > 0", resume: reconciler, label: "addressing integration review feedback", feedback: "Here's review feedback to address:"}
          - {if: "output.minor > 0", resume: reconciler, label: "integrating minor improvements", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          - {if: {status: Error}, pause: true}
          - {else: true, set: {slow_verify_tolerated: output.tolerated}, goto: check-cleared}

      # Merge door: the reviewer can accept a tree no slow gate ever passed (an
      # environmental failure it repaired). Re-ask the shared clearance predicate and
      # route an uncleared tree back through the gate instead of on to the human. The
      # backward goto is counted against THIS step, so the inherited max_loops bounds it.
      - name: check-cleared
        show_label: false
        command: ./scripts/check-cleared.sh "{{ vars.slow_verify_tolerated }}"
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 3}, goto: integration-verify, label: "re-running tests"}
          - {else: true, pause: true}

      - name: summarizer
        file: agents/summarizer.md
        tier: medium
        label: summarizing quest
        rules:
          - {else: true, goto: finalize}

      - name: finalize
        file: agents/finalize.md
        tier: high
        label: finalizing
        interactive: true
        rules:
          - {if: {decision: merge},  goto: cleanup-merge, label: "preparing to merge"}
          - {if: {decision: rework}, set: {plan_index: "var.plan_index + 1", plan_total: "var.plan_total + 1"}, goto: plan-writer, progress: true, release: merge-lane, label: "addressing review feedback", feedback: "Here's the feedback to address:"}
          - {else: true, pause: true}

      - name: cleanup-merge
        show_label: false
        command: ./scripts/cleanup.sh
        rules:
          - {if: {exit: 0}, goto: assert-stamped}
          - {if: {exit: 2}, continue: true}
          - {else: true, pause: true}

      - name: autosquash-resolve-merge
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving merge fixups
        clean_tree: false   # the conflicted-fold entry runs inside an in-progress
                            # autosquash rebase, whose legitimate completion may
                            # still be mid-rebase
        rules:
          - {else: true, goto: cleanup-merge}

      - name: assert-stamped
        show_label: false
        command: ./scripts/assert-stamped.sh "{{ vars.slow_verify_tolerated }}"
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      - name: merge-to-base
        kind: merge_and_exit_worktree
        label: merging
        max_loops: 3                      # recovery passes before giving up to a human
        rules:
          - {if: {merge: MERGED},   continue: true}
          - {if: {merge: DIRTY},    goto: reconciler,
             label: "committing leftover changes",
             feedback: "The merge couldn't proceed because the quest worktree still had uncommitted changes. Commit your resolution; integration will retry."}
          - {if: {merge: CONFLICT}, goto: integrate-rebase, label: "retrying integration"}
          - {if: {merge: REFUSED},  pause: true}
          - {else: true, pause: true}
