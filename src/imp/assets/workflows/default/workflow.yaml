name: feature
description: |
  spec -> (plan -> implement*)* -> review -> merge


# The tier menu is config.tiers.keys() (always low/medium/high in this design).
# Single provider by design: review independence is by MODEL TIER (an opus panel
# reviewing sonnet's work), not by vendor. `differ_from` is removed from the
# review phase. The `review` step is a sonnet coordinator that runs INSIDE the
# per-plan implement loop; it dispatches a four-member opus panel on first pass,
# or just the generalist reviewer on re-entry (panel_done) or fast-path. The
# deferred-sweep drains Minor/Nit observations after each plan. The review phase
# runs a trimmed end-of-change integration pass only when >1 plan was needed.

vars:
  ready_to_merge:         {type: bool, default: false}
  final_review:           {type: bool, default: true}
  fast_path:              {type: bool, default: false}
  spec_minors_integrated: {type: bool, default: false}
  plan_minors_integrated: {type: bool, default: false}
  panel_done:             {type: bool, default: false}
  multi_plan:             {type: bool, default: false}   # >1 plan was needed (set on plan-cycle-check supercycle); gates the end-of-change integration pass
  integration_pass:       {type: bool, default: false}   # true only during the trimmed end-of-change integration pass; review-panel runs the two cross-cutting slices only
  integration_needs_review: {type: bool, default: false}
  spec_confirm:           {type: bool, default: true}    # confirm-gate enable
  spec_unseen_changes:    {type: bool, default: false}   # some turn changed the spec without user direction

defaults:
  max_retries: 3
  max_loops: 1000
  max_tool_calls: 10000

phases:
  - name: spec
    steps:
      - name: spec-writer
        file: agents/spec-writer.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["imp/specs/**"], mode: allow}
        rules:
          - {else: true,
             set: {fast_path: "output.complexity == 'trivial'",
                   spec_unseen_changes: "spec_unseen_changes or unseen_changes"},
             continue: true}

      - name: spec-verify-commit
        quiet: true
        command: ./scripts/spec-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: spec-writer}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        # The reviewer gets the last word: the loop ends only on a clean review with
        # nothing left to integrate. spec_minors_integrated tracks whether the writer
        # has already spent its one minors-integration pass for the current settled
        # state — so a clean *verification* review stops and drops its own minors.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {spec_minors_integrated: false},
             resume: spec-writer, feedback: "Here's review feedback to address:"}
          # Clean with actionable minors, not yet integrated -> one minors pass; owe a verification review.
          - {if: {spec_minors_integrated: false, has_minor_findings: true}, set: {spec_minors_integrated: true},
             resume: spec-writer, feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean and settled (verification pass, or nothing actionable) AND the spec changed this
          # cycle with confirm enabled -> forward confirm gate; the verification review's minors are dropped.
          - {if: {spec_confirm: true, spec_unseen_changes: true},
             set: {spec_minors_integrated: false, spec_unseen_changes: false}, goto: spec-confirm}
          # Clean and settled, no confirm needed -> proceed to planning.
          - {else: true, set: {spec_minors_integrated: false, spec_unseen_changes: false}, goto: plan-writer}

      - name: spec-confirm
        file: agents/spec-confirm.md
        tier: medium
        fs_permissions:
          - {operations: [read], paths: ["**"], mode: allow}
        rules:
          # User requested changes -> resume the writer; re-arm the confirm gate so the
          # re-review re-presents (the writer's user-directed edits emit unseen_changes:false).
          - {if: {confirm: changes}, set: {spec_unseen_changes: true},
             resume: spec-writer, feedback: "The user reviewed the spec and requested changes. Address them:"}
          # Approved -> forward to planning.
          - {else: true, goto: plan-writer}

  - name: plan
    steps:
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["imp/plans/**"], mode: allow}

      - name: plan-verify-commit
        quiet: true
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

      - name: fast-path-plan-gate      # trivial change -> skip plan review entirely
        quiet: true
        rules:
          - {if: {fast_path: true}, goto: task-lead}   # skip plan-review on fast-path
          - {else: true, continue: true}

      - name: plan-review
        file: agents/plan-reviewer.md
        tier: high
        # Mirrors spec-reviewer: the reviewer gets the last word. plan_minors_integrated
        # tracks whether the writer has already spent its one minors-integration pass.
        rules:
          # Critical/Major -> rework, then re-review. Clear the flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {plan_minors_integrated: false}, resume: plan-writer, feedback: "Here's review feedback to address:"}
          # Clean, and the writer already did its minors-integration pass -> stop; drop this review's minors.
          - {if: {plan_minors_integrated: true}, set: {plan_minors_integrated: false}, goto: task-lead}
          # Clean with actionable minors -> integrate them, then owe one more (verification) review.
          - {if: {has_minor_findings: true}, set: {plan_minors_integrated: true}, resume: plan-writer, feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean, nothing to integrate -> stop.
          - {else: true, goto: task-lead}

  - name: implement
    steps:
      - name: task-lead
        file: agents/task-lead.md
        tier: medium
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {if: {deviation: true}, resume: plan-writer, feedback: "The plan didn't match the codebase. Here's what the implementer found:"}
          - {if: {done: false},     goto: task-lead}
          - {else: true, continue: true}

      - name: commit-check
        quiet: true
        command: ./scripts/implement-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: task-lead}

      - name: run-tests
        command: ./scripts/run-tests.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: task-lead}

      # ── autosquash + stamp-trailers run INSIDE the per-plan loop so each panel
      #    reviews folded, one-commit-per-task diffs. autosquash.sh folds AND (on
      #    re-entry after autosquash-resolve) verifies the fold preserved the tree,
      #    in one script. The clean fold is a pure deterministic step (no agent).
      - name: autosquash
        quiet: true
        command: ./scripts/autosquash.sh
        rules:
          - {if: {exit: 0}, goto: stamp-trailers}  # clean fold / verified resolution: skip the resolver
          - {if: {exit: 2}, continue: true}        # resolvable fold conflict / verify failed -> autosquash-resolve
          - {else: true, pause: true}              # hard failure (exit 1) / verify bound exhausted -> human

      - name: autosquash-resolve
        file: agents/autosquash-resolve.md
        tier: high
        max_loops: 6                               # defensive backstop; the script's 3-attempt bound aborts first
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {else: true, goto: autosquash}         # re-run autosquash.sh -> verify-mode (before-tree sentinel present)

      - name: stamp-trailers
        quiet: true
        command: ./scripts/stamp-trailers.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      # ── merged review-panel + recheck. The agent tiers INTERNALLY on vars:
      #    first pass (panel_done false, not fast_path) = full opus 4-member panel;
      #    fix-round re-entry (panel_done true) or fast_path = cheap sonnet re-verify.
      - name: review
        file: agents/review-panel.md
        tier: medium
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/change/**"], mode: allow}   # append deferred observations to progress.md
        rules:
          - {if: {verdict: task_gap}, set: {panel_done: true}, goto: task-lead, feedback: "The review found gaps to fix. Findings:"}
          - {if: {verdict: plan_gap}, set: {panel_done: true}, goto: plan-writer, feedback: "The review found the plan needs revision. Findings:"}
          - {else: true, set: {panel_done: true}, continue: true}

      - name: deferred-sweep
        file: agents/deferred-sweep.md
        tier: medium
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        # no rules: continue-on-success. The sweep drains the list and never routes.

      - name: sweep-tests
        command: ./scripts/run-tests.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: deferred-sweep}

      - name: fast-path-cycle-gate
        quiet: true
        rules:
          - {if: {fast_path: true}, goto: integration-gate}   # trivial: single-plan; integration-gate skips the pass and stamps sweep commits
          - {else: true, continue: true}

      - name: plan-cycle-check
        file: agents/plan-cycle-check.md
        tier: medium        # Sonnet coverage judgment
        max_loops: 10                # plans-per-spec bound
        rules:
          - {if: {more_plans: true}, set: {panel_done: false, multi_plan: true}, goto: plan-writer, feedback: "More plans are needed for this spec. Coverage assessment:"}     # supercycle
          - {else: true, continue: true}

  - name: review
    steps:
      # ── trimmed end-of-change integration pass: ONLY when >1 plan ran ──
      - name: integration-gate
        quiet: true
        rules:
          - {if: {multi_plan: false}, goto: stamp-sweep-trailers}   # single plan: the per-plan pass WAS the whole-change pass; still stamp sweep commits
          - {else: true, set: {integration_pass: true}, continue: true}

      - name: integration-pass        # review-panel.md in integration_pass mode: completeness + boundaries slices over the whole-change diff
        file: agents/review-panel.md
        tier: medium
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/change/**"], mode: allow}
        rules:
          - {if: {verdict: task_gap}, set: {integration_pass: false}, goto: task-lead, feedback: "The integration pass found cross-plan gaps. Findings:"}
          - {if: {verdict: plan_gap}, set: {integration_pass: false}, goto: plan-writer, feedback: "The integration pass found the plan needs revision. Findings:"}
          - {else: true, set: {integration_pass: false}, continue: true}

      - name: integration-sweep       # cross-plan deferred sweep over the whole change
        file: agents/deferred-sweep.md
        tier: medium
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}

      - name: integration-sweep-tests
        command: ./scripts/run-tests.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: integration-sweep}

      - name: stamp-sweep-trailers     # idempotently stamp Change: on sweep commits the per-plan stamp-trailers could not reach
        quiet: true
        command: ./scripts/stamp-trailers.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      # ── integrate base into the branch, before review folds into one decision ──
      - name: integrate-merge
        quiet: true
        command: ./scripts/integrate-merge.sh
        rules:
          - {if: {exit: 2}, goto: summarizer}
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      - name: integrator
        file: agents/integrator.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {if: {integration: review}, set: {integration_needs_review: true}, continue: true}
          - {else: true, set: {integration_needs_review: false}, continue: true}

      - name: integrate-tests
        command: ./scripts/run-tests.sh
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: integrator}

      - name: integration-review
        file: agents/integration-reviewer.md
        tier: high
        max_loops: 5
        rules:
          - {if: {verdict: task_gap}, resume: integrator, feedback: "Integration review found gaps in the merge resolution. Findings:"}
          - {if: {verdict: plan_gap}, resume: integrator, feedback: "Integration review flagged a deeper issue with the merge. Findings:"}
          - {else: true, continue: true}

      - name: summarizer
        file: agents/summarizer.md
        tier: high

      - name: final-review-gate
        quiet: true
        rules:
          - {if: {final_review: false}, set: {ready_to_merge: true}, goto: merge}
          - {if: {ready_to_merge: true, integration_needs_review: false}, goto: merge}
          - {else: true, continue: true}

      - name: final-review
        file: agents/final-review.md
        tier: medium
        max_loops: 20
        rules:
          - {if: {decision: merge},  set: {ready_to_merge: true}, continue: true}
          - {if: {decision: rework}, goto: implement, feedback: "Here's the feedback to address:"}
          - {else: true, pause: true}

  # ── merge ───────────────────────────────────────────────────────────
  - name: merge
    steps:
      - name: base-fresh-check       # B3: cheap pre-lock freshness fast-path
        quiet: true
        command: ./scripts/base-fresh-check.sh
        rules:
          - {if: {exit: 0}, continue: true}          # base unchanged / not-integrated -> take the lock
          - {if: {exit: 10}, goto: integrate-merge}  # base advanced -> re-integrate
          - {else: true, pause: true}                # exit 1 preamble failure -> human

      - name: merge-to-base          # B3: engine-native, lock-protected, routable
        kind: merge
        rules:
          - {if: {merge: STALE}, goto: integrate-merge}   # base moved between check and lock -> re-integrate
          - {if: {merge: MERGED}, continue: true}          # falls through to _complete finalize
          - {else: true, pause: true}                      # defensive fallback; _route_merge intercepts CONFLICT/REFUSED/DIRTY first to emit merge_blocked + a reasoned pause
