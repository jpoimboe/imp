name: standard-feature
description: |
  Standard imp workflow: spec -> plan -> implement -> review -> merge.
  spec is an interactive brainstorm with the user.

model_rules:
  code_review:
    differ_provider_from: code

model_tiers: [fast, balanced, powerful]

defaults:
  max_retries: 3
  max_loops: 6

phases:
  - name: spec
    steps:
      - name: spec-writer
        file: agents/spec-writer.md
        model_role: spec
        interactive: true
        max_tool_calls: 10
        fs_permissions:
          - {operations: [read],  paths: ["/project/**", "/artifacts/**"], mode: allow}
          - {operations: [write], paths: ["/artifacts/**"], mode: allow}
          - {operations: [write], paths: ["/**"], mode: deny}

      - name: spec-check
        command: ./scripts/check-artifact.sh spec
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: spec-writer}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        model_role: spec_review
        rules:
          - {if: {verdict: approve}, continue: true}
          - {if: {verdict: rework},  resume: spec-writer}
          - {else: true, pause: true}

  - name: plan
    steps:
      - name: plan-writer
        file: agents/plan-writer.md
        model_role: default
        fs_permissions:
          - {operations: [read],  paths: ["/project/**", "/artifacts/**"], mode: allow}
          - {operations: [write], paths: ["/artifacts/**"], mode: allow}
          - {operations: [write], paths: ["/**"], mode: deny}

      - name: plan-check
        command: ./scripts/check-artifact.sh plan
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

  - name: implement
    steps:
      - name: coder
        file: agents/coder.md
        model_role: code
        fs_permissions:
          - {operations: [read],  paths: ["/project/**", "/artifacts/**"], mode: allow}
          - {operations: [write], paths: ["/project/**"], mode: allow}
          - {operations: [write], paths: ["/artifacts/**"], mode: allow}

      - name: run-tests
        command: ./scripts/run-tests.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: coder}

      - name: documenter
        file: agents/documenter.md
        model_role: code
        fs_permissions:
          - {operations: [read],  paths: ["/project/**", "/artifacts/**"], mode: allow}
          - {operations: [write], paths: ["/project/**"], mode: allow}
          - {operations: [write], paths: ["/artifacts/**"], mode: allow}

  - name: review
    steps:
      - name: code-reviewer
        file: agents/code-reviewer.md
        model_role: code_review
        rules:
          - {if: {verdict: approve}, continue: true}
          - {if: {verdict: rework},  goto: implement}
          - {else: true, pause: true}

      - name: merge-gate
        ask: "Merge?"
        options:
          - {label: Merge,             continue: true}
          - {label: Back to implement, goto: implement}

  - name: merge
    steps: []
