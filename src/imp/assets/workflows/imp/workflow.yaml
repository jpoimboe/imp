name: feature
description: |
  spec -> (plan -> implement*)* -> merge


# Single provider by design: review independence is by MODEL TIER (a high-tier
# reviewer judging the medium-tier implementer's work), not by vendor. Review fires on
# an ACCUMULATED-TASK cadence decided by plan-cycle-check, the sole coverage guard: a
# single `code-reviewer` runs as the `code-reviewer` step directly — per batch
# (review_base..HEAD) when tasks_since_review crosses review_batch_size, and once over
# the whole change at change end (review_scope=change, cur_base_head..HEAD). deferred-sweep
# is paired with each review; verify and plan-reviewer stay per-plan.

vars:
  fast_path:              {type: bool, default: false}
  spec_minors_integrated: {type: bool, default: false}
  plan_minors_integrated: {type: bool, default: false}
  review_scope:           {type: string, default: plan}  # plan | change — per-batch vs end-of-change review
  review_base:            {type: string, default: ""}    # SHA defining the per-batch review diff range
  tasks_since_review:     {type: int, default: 0}         # accumulated implemented-task counter
  review_batch_size:      {type: int, default: 7}         # N: per-batch review fires when the counter crosses this
  change_panel_done:      {type: bool, default: false}   # latched after the once-only end-of-change full panel; a later rework re-entry is reviewed per-batch, not re-paneled

defaults:
  max_retries: 3
  max_loops: 1000
  max_tool_calls: 10000

phases:
  - name: spec
    steps:
      - name: spec-writer
        file: agents/spec-writer.md
        tier: high
        label: writing spec
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/changes/*/artifacts/spec/**", ".imp/changes/*/progress.md"], mode: allow}
        rules:
          - {else: true, set: {fast_path: "output.complexity == 'trivial'"}, continue: true}

      - name: spec-verify-commit
        quiet: true
        command: ./scripts/spec-commit-verify.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: plan-writer}   # trivial fast path: skip spec-reviewer, enter planning
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: spec-writer}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        label: reviewing spec
        # The reviewer gets the last word: the loop ends only on a clean review with
        # nothing left to integrate. spec_minors_integrated tracks whether the writer
        # has already spent its one minors-integration pass for the current settled
        # state — so a clean *verification* review stops and drops its own minors.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {spec_minors_integrated: false},
             resume: spec-writer, label: "addressing spec review feedback", feedback: "Here's review feedback to address:"}
          # Clean with actionable minors, not yet integrated -> one minors pass; owe a verification review.
          - {if: {spec_minors_integrated: false, has_minor_findings: true}, set: {spec_minors_integrated: true},
             resume: spec-writer, label: "addressing spec review feedback", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean and settled (verification pass, or nothing actionable) -> proceed to planning.
          - {else: true, set: {spec_minors_integrated: false}, goto: plan-writer}

  - name: plan
    steps:
      # plan-writer is the plan-phase entry: the spec phase routes here, and supercycle/rework goto plan-writer directly.
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        label: writing plan
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/changes/*/artifacts/plans/**", ".imp/changes/*/progress.md"], mode: allow}

      - name: plan-verify-commit
        quiet: true
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: task-lead}   # trivial change: skip plan review entirely
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

      - name: plan-reviewer
        file: agents/plan-reviewer.md
        tier: high
        label: reviewing plan
        # A single plan-reviewer runs directly as the step at its own high tier (the
        # prior medium tier was only the coordinator's dispatch-and-collapse cost); the
        # engine routes its {status, findings, blocking, has_minor_findings} output
        # through these rules. plan_minors_integrated tracks the writer's one minors-
        # integration pass: set only on the clean-with-minors bounce-back, cleared on
        # every rework/terminal branch. Mirrors the spec minors loop.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {plan_minors_integrated: false}, resume: plan-writer, label: "addressing plan review feedback", feedback: "Here's review feedback to address:"}
          # Clean, and the writer already did its minors-integration pass -> stop.
          - {if: {plan_minors_integrated: true}, set: {plan_minors_integrated: false}, goto: task-lead}
          # Clean with actionable minors -> integrate them, then owe one more (verification) review.
          - {if: {has_minor_findings: true}, set: {plan_minors_integrated: true}, resume: plan-writer, label: "addressing plan review feedback", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean, nothing to integrate -> stop.
          - {else: true, goto: task-lead}

  - name: implement
    steps:
      - name: task-lead
        file: agents/task-lead.md
        tier: medium
        label: implementing
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {if: {deviation: true}, resume: plan-writer, label: "plan/code mismatch, going back to planning", feedback: "The plan didn't match the codebase. Here's what the implementer found:"}
          - {if: {verify_tolerated: true}, goto: cleanup-implement}
          - {if: {done: false},     goto: task-lead}
          - {else: true, continue: true}

      - name: verify
        command: ./scripts/run-verify.sh
        label: testing
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: task-lead}

      # cleanup folds this batch's fixup chain into one commit per task AND stamps the
      # Change: trailer over (review_base or fork)..HEAD, BEFORE any review reads the
      # diff. exit 0 skips the resolver; exit 2 falls through into it.
      - name: cleanup-implement
        quiet: true
        command: './scripts/cleanup.sh "{{ vars.review_base }}"'
        rules:
          - {if: {exit: 0}, goto: plan-cycle-check}     # clean fold+stamp -> coverage check
          - {if: {exit: 2}, continue: true}             # resolvable fold conflict -> resolver
          - {if: {exit: 3}, resume: task-lead}          # dirty tree: the agent left work
          - {else: true, pause: true}                   # hard failure / out-of-range fixup

      - name: autosquash-resolve-implement
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving fixups
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {else: true, goto: cleanup-implement}

      # SOLE arbiter of coverage AND review cadence. Increments tasks_since_review by the
      # just-completed plan's task count (read from the plan file) and emits the running
      # total as `running_tasks`. First-match-wins; more_plans:false wins over the counter.
      - name: plan-cycle-check
        file: agents/plan-cycle-check.md
        tier: medium
        label: checking plan coverage
        rules:
          # batch full (more scope remains AND counter crossed N) -> per-batch review.
          # Force review_scope back to 'plan' so a stale 'change' from a prior end-of-change
          # pass (e.g. a finalize-rework that re-opens coverage) can never mislabel this
          # per-batch review as the full panel.
          - {if: "output.more_plans and output.running_tasks >= review_batch_size",
             set: {tasks_since_review: "output.running_tasks", review_scope: "'plan'"}, goto: code-reviewer}
          # more scope, batch not full -> supercycle to plan-writer (skip review/sweep this lap)
          - {if: {more_plans: true}, set: {tasks_since_review: "output.running_tasks", review_scope: "'plan'"},
             goto: plan-writer, label: "write next plan", feedback: "More plans are needed for this spec. Coverage assessment:"}
          # coverage complete, trivial change -> no panel, straight to finalize
          # (the per-batch cleanup already folded+stamped this batch)
          - {if: {fast_path: true}, set: {tasks_since_review: "output.running_tasks"}, goto: finalize}
          # coverage complete AND the full panel already ran once -> a corrective/gap-fix batch
          # (after a finalize/integration rework) is reviewed over its OWN review_base..HEAD diff
          # (review_scope='plan'), not a fresh whole-change panel each round.
          - {if: {change_panel_done: true}, set: {review_scope: "'plan'", tasks_since_review: "output.running_tasks"}, goto: code-reviewer}
          # FIRST coverage-complete -> end-of-change FULL panel over the whole-change diff, exactly
          # once. Latch change_panel_done so a later rework re-entry never re-fires the full panel.
          - {else: true, set: {review_scope: "'change'", change_panel_done: true, tasks_since_review: "output.running_tasks"}, goto: code-reviewer}

      # The review step IS the code-reviewer (no coordinator/panel): per-batch it
      # reviews review_base..HEAD; at change end (review_scope==change) it reviews
      # cur_base_head..HEAD. It routes — verdict is approve | task_gap only (coverage is
      # plan-cycle-check's call, never the reviewer's).
      - name: code-reviewer
        file: agents/code-reviewer.md
        tier: high
        label: reviewing code
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/changes/*/**"], mode: allow}   # append deferred observations
        rules:
          - {if: {verdict: task_gap}, goto: task-lead, label: "addressing code review feedback", feedback: "The code-reviewer found an implemented task needs rework. Findings:"}
          - {if: {status: Error}, pause: true}
          - {else: true, continue: true}

      - name: deferred-sweep
        file: agents/deferred-sweep.md
        tier: medium
        label: resolving deferred items
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {if: {sweep_tolerated: true}, goto: cleanup-sweep}
          - {else: true, continue: true}

      - name: sweep-verify
        command: ./scripts/run-verify.sh
        label: testing
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: deferred-sweep}

      # Fold + stamp this batch's sweep commits over the same (review_base or fork)..HEAD
      # range before the diff base advances. Mirrors cleanup-implement.
      - name: cleanup-sweep
        quiet: true
        command: './scripts/cleanup.sh "{{ vars.review_base }}"'
        rules:
          - {if: {exit: 0}, goto: review-base-repin}
          - {if: {exit: 2}, continue: true}
          - {if: {exit: 3}, resume: deferred-sweep}
          - {else: true, pause: true}

      - name: autosquash-resolve-sweep
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving fixups
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {else: true, goto: cleanup-sweep}

      # After a batch's review + sweep settle, advance the diff base to HEAD and reset
      # the counter. The end-of-change pass (review_scope==change) is the last review,
      # so route it to finalize (the per-batch cleanup already stamped); a per-batch
      # pass returns to plan-writer for the next plan.
      - name: review-base-repin
        quiet: true
        command: 'cd "$IMP_PROJECT_ROOT" && git rev-parse HEAD'
        rules:
          - {if: {exit: 0, review_scope: change}, set: {review_base: output.stdout, tasks_since_review: 0}, goto: finalize}
          # Invariant: once the full panel has run, spec coverage is complete, so plan-cycle-check
          # never re-enters with more_plans:true; every post-panel per-batch settle is therefore
          # terminal -> route a corrective/gap-fix batch to finalize, not the next plan. (This keys
          # solely on change_panel_done; it is correct only while more_plans means uncovered SPEC
          # scope. If a post-panel corrective could ever legitimately span a multi-plan supercycle,
          # this rule would need a more_plans guard to avoid dropping the remaining corrective plans.)
          - {if: {exit: 0, change_panel_done: true}, set: {review_base: output.stdout, tasks_since_review: 0}, goto: finalize}
          - {if: {exit: 0}, set: {review_base: output.stdout, tasks_since_review: 0}, goto: plan-writer}
          - {else: true, pause: true}

      - name: finalize
        file: agents/finalize.md
        tier: high
        label: finalizing
        max_loops: 20
        rules:
          - {if: {decision: merge},  goto: wait-for-head, label: "preparing to merge"}
          - {if: {decision: rework}, goto: plan-writer, label: "addressing review feedback", feedback: "Here's the feedback to address:"}
          - {else: true, pause: true}

  # ── merge: the FIFO merge queue. Only the head touches the base. ───────
  - name: merge
    steps:
      - name: wait-for-head
        acquire: base
        label: waiting to merge
        rules:
          - {else: true, continue: true}

      - name: integrate-rebase
        quiet: true
        command: ./scripts/integrate-rebase.sh
        rules:
          - {if: {exit: 2}, goto: assert-stamped}                                  # base unmoved, merge directly: implement-phase cleanup already stamped
          - {if: {exit: 0}, set: {review_base: "''"}, goto: integration-reviewer}  # clean replant onto a moved base -> clear the pin so cleanup-merge folds/stamps the whole change
          - {if: {exit: 6}, set: {review_base: "''"}, continue: true}              # rebase stopped on a conflict -> integrator; the replant rewrote history, clear the pin
          - {else: true, pause: true}

      - name: integrator
        file: agents/integrator.md
        tier: high
        label: integrating
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}

      - name: integration-reviewer
        file: agents/integration-review.md
        tier: high
        label: reviewing merge
        rules:
          - {if: {verdict: breakage}, goto: integration-resolver}
          - {else: true, continue: true}

      - name: integration-verify
        command: ./scripts/run-verify.sh
        label: testing
        rules:
          - {if: {exit: 0}, continue: true}        # green -> cleanup-merge folds+stamps, then assert-stamped, then merge
          - {if: {exit: 124}, pause: true}
          - {else: true, goto: integration-resolver}

      # Fold + stamp the change over (review_base or fork)..HEAD before it merges. By
      # now integrate-rebase has cleared review_base on a replant, so this folds/stamps
      # the whole change from the fork; the re-stamp is content-idempotent. Mirrors
      # cleanup-implement/cleanup-sweep. exit 0 skips the resolver to assert-stamped.
      - name: cleanup-merge
        quiet: true
        command: './scripts/cleanup.sh "{{ vars.review_base }}"'
        rules:
          - {if: {exit: 0}, goto: assert-stamped}   # clean fold+stamp -> pre-merge backstop
          - {if: {exit: 2}, continue: true}         # resolvable fold conflict -> resolver
          - {if: {exit: 3}, resume: integrator}     # dirty tree: the integrator left work
          - {else: true, pause: true}               # hard failure / out-of-range fixup

      - name: autosquash-resolve-merge
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving fixups
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {else: true, goto: cleanup-merge}

      - name: integration-resolver
        file: agents/integration-resolve.md
        release: base
        tier: high
        label: resolving merge
        max_loops: 20
        rules:
          - {if: {decision: merge},  goto: wait-for-head}
          - {if: {decision: rework}, goto: plan-writer, label: "addressing review feedback", feedback: "Here's the feedback to address:"}
          - {else: true, pause: true}

      # Read-only PRE-MERGE backstop: no rebase, no mutation. Asserts every non-merge
      # commit in fork..HEAD carries Change: <id> and no fixup!/squash!/amend! subject
      # remains. cleanup guarantees this on every normal path; this catches a future
      # path that reaches merge-to-base without passing through cleanup. exit 0 -> merge.
      - name: assert-stamped
        quiet: true
        command: ./scripts/assert-stamped.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      - name: merge-to-base
        kind: merge_and_exit_worktree
        label: merging
        rules:
          - {if: {merge: MERGED}, continue: true}
          - {else: true, pause: true}
