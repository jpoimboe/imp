name: feature
description: |
  front-door -> spec -> (plan -> implement*)* -> integrate


# Single provider by design: review independence is by MODEL TIER (a high-tier
# reviewer judging the coder's work), not by vendor. Review fires PER PLAN: a
# single `plan-code-reviewer` step reviews each settled plan over review_base..HEAD,
# plus once over the whole change at change end (review_scope=change,
# cur_base_head..HEAD) when the change spanned more than one plan. deferred-sweep is
# paired with each review; verify and plan-reviewer stay per-plan. The spec's
# ## Plan outline drives the plan loop and seeds plan_total; gap-check is the sole
# end-of-change coverage backstop and latches coverage_settled on success.

vars:
  fast_path:              {type: bool, default: false}
  spec_minors_integrated: {type: bool, default: false}
  plan_minors_integrated: {type: bool, default: false}
  review_scope:           {type: string, default: plan}  # plan | change — per-plan vs end-of-change review
  review_base:            {type: string, default: ""}    # SHA defining the per-plan review diff range
  coverage_settled:       {type: bool, default: false}   # latched once gap-check is clean; gates the once-only end-of-change gap-check AND the change-wide review; a later rework re-entry is reviewed per-plan, not re-paneled
  integration_fork:       {type: string, default: ""}    # pre-rebase fork SHA P, captured from integrate-rebase.sh stdout on the clean/conflict paths
  plan_index:             {type: int, default: 1}         # current plan number, rendered in plan/task step labels
  plan_total:             {type: int, default: 1}         # total plans for the run; seeded from the spec's ## Plan outline (via plan-writer's plan-1 echo). >= plan_index. gap-check bumps it only when authoring a corrective.
  task_total:             {type: int, default: 0}         # tasks in the current plan, set by plan-finalized

defaults:
  max_retries: 3
  max_loops: 1000
  max_tool_calls: 10000

phases:
  # ── front-door: phase 0, a bare conversation (chrome:none). It answers
  # questions, scouts existing work, or scopes a build; on go-live it sets the
  # ceremony and routes into the pipeline. express skips the spec beat entirely
  # (the new edge); full enters spec-finalizer for adopt-with-light-review.
  - name: front-door
    chrome: none
    steps:
      - name: front-door
        file: agents/front-door.md
        tier: high
        label: "<imp>"
        rules:
          - {if: {ceremony: express}, set: {fast_path: true}, goto: plan-writer, label: "writing plan", feedback: "Plan this from the spec drafted with the user:"}
          - {else: true, set: {fast_path: false}, goto: spec-finalizer, label: "writing spec", feedback: "Adopt the spec drafted with the user and finalize it:"}

  - name: spec
    label: "spec phase"
    steps:
      - name: spec-finalizer
        file: agents/spec-finalizer.md
        tier: high
        label: finalizing spec
        rules:
          - {else: true, continue: true}

      - name: spec-verify-commit
        quiet: true
        command: ./scripts/spec-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: spec-finalizer}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        label: reviewing spec
        read_only: ["."]
        # The reviewer gets the last word: the loop ends only on a clean review with
        # nothing left to integrate. spec_minors_integrated tracks whether the writer
        # has already spent its one minors-integration pass for the current settled
        # state — so a clean *verification* review stops and drops its own minors.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {spec_minors_integrated: false},
             resume: spec-finalizer, label: "addressing spec review feedback", feedback: "Here's review feedback to address:"}
          # Clean with actionable minors, not yet integrated -> one minors pass; owe a verification review.
          - {if: {spec_minors_integrated: false, has_minor_findings: true}, set: {spec_minors_integrated: true},
             resume: spec-finalizer, label: "addressing spec review feedback", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean and settled (verification pass, or nothing actionable) -> proceed to planning.
          - {else: true, set: {spec_minors_integrated: false}, goto: plan-writer}

  - name: plan
    label: "planning phase · plan {{ vars.plan_index }}/{{ vars.plan_total }}"
    steps:
      # plan-writer is the plan-phase entry: the spec phase routes here, and supercycle/rework goto plan-writer directly.
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        label: "writing plan"
        rules:
          # First plan only: seed plan_total from plan-writer's outline-derived count.
          # On later plans gap-check owns plan_total (it bumps it only when authoring a
          # corrective), so this capture must not re-fire.
          - {if: {plan_index: 1}, set: {plan_total: output.plan_total}, continue: true}
          - {else: true, continue: true}

      - name: plan-verify-commit
        quiet: true
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: plan-finalized}   # trivial change: skip plan review entirely
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

      - name: plan-reviewer
        file: agents/plan-reviewer.md
        tier: high
        label: "reviewing plan"
        read_only: ["."]
        # A single plan-reviewer runs directly as the step at its own high tier (the
        # prior medium tier was only the coordinator's dispatch-and-collapse cost); the
        # engine routes its {status, findings, blocking, has_minor_findings} output
        # through these rules. plan_minors_integrated tracks the writer's one minors-
        # integration pass: set only on the clean-with-minors bounce-back, cleared on
        # every rework/terminal branch. Mirrors the spec minors loop.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {plan_minors_integrated: false}, resume: plan-writer, label: "addressing plan review feedback", feedback: "Here's review feedback to address:"}
          # Clean, and the writer already did its minors-integration pass -> stop.
          - {if: {plan_minors_integrated: true}, set: {plan_minors_integrated: false}, goto: plan-finalized}
          # Clean with actionable minors -> integrate them, then owe one more (verification) review.
          - {if: {has_minor_findings: true}, set: {plan_minors_integrated: true}, resume: plan-writer, label: "addressing plan review feedback", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean, nothing to integrate -> stop.
          - {else: true, goto: plan-finalized}

      - name: plan-finalized
        file: agents/plan-finalized.md
        tier: medium
        label: "finalizing plan"
        read_only: ["."]
        rules:
          - {else: true, set: {task_total: output.task_total}, goto: task-lead}

  - name: implement
    label: "implementation phase · plan {{ vars.plan_index }}/{{ vars.plan_total }}"
    steps:
      - name: task-lead
        position_label: true
        file: agents/task-lead.md
        tier: high
        label: "task 1/{{ vars.task_total }}"
        rules:
          - {if: {verify_tolerated: true}, goto: cleanup-implement}
          - {else: true, continue: true}

      - name: verify
        command: ./scripts/run-verify.sh
        label: running tests
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: task-lead}

      # cleanup folds this batch's fixup chain into one commit per task AND stamps the
      # Change: trailer over (review_base or fork)..HEAD, BEFORE any review reads the
      # diff. exit 0 skips the resolver; exit 2 falls through into it.
      - name: cleanup-implement
        quiet: true
        command: './scripts/cleanup.sh "{{ vars.review_base }}"'
        rules:
          - {if: {exit: 0}, goto: plan-code-reviewer}   # clean fold+stamp -> per-plan review
          - {if: {exit: 2}, continue: true}             # resolvable fold conflict -> resolver
          - {if: {exit: 3}, resume: task-lead}          # dirty tree: the agent left work
          - {else: true, pause: true}                   # hard failure / out-of-range fixup

      - name: autosquash-resolve-implement
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving task fixups
        max_loops: 6
        rules:
          - {else: true, goto: cleanup-implement}

      # The review step IS the plan-code-reviewer (no coordinator/panel): per-plan it
      # reviews review_base..HEAD; at change end (review_scope==change) it reviews
      # cur_base_head..HEAD. It routes — verdict is approve | task_gap only (coverage is
      # gap-check's call, never the reviewer's).
      - name: plan-code-reviewer
        file: agents/plan-code-reviewer.md
        tier: high
        label: batch code review
        max_loops: 6
        rules:
          - {if: {verdict: task_gap}, goto: task-lead, label: "addressing code review feedback", feedback: "The plan-code-reviewer found an implemented task needs rework. Findings:"}
          - {if: {status: Error}, pause: true}
          - {else: true, continue: true}

      - name: deferred-sweep
        file: agents/deferred-sweep.md
        tier: medium
        label: sweeping deferred tasks
        rules:
          - {if: {sweep_tolerated: true}, goto: cleanup-sweep}
          - {else: true, continue: true}

      - name: sweep-verify
        command: ./scripts/run-verify.sh
        label: running tests
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: deferred-sweep}

      # Fold + stamp this batch's sweep commits over the same (review_base or fork)..HEAD
      # range before the diff base advances. Mirrors cleanup-implement.
      - name: cleanup-sweep
        quiet: true
        command: './scripts/cleanup.sh "{{ vars.review_base }}"'
        rules:
          - {if: {exit: 0}, goto: review-base-repin}
          - {if: {exit: 2}, continue: true}
          - {if: {exit: 3}, resume: deferred-sweep}
          - {else: true, pause: true}

      - name: autosquash-resolve-sweep
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving sweep fixups
        max_loops: 6
        rules:
          - {else: true, goto: cleanup-sweep}

      # After a plan's review + sweep settle, advance the diff base to HEAD and route:
      #  - the change-wide pass just ran (review_scope==change) -> summarizer;
      #  - a post-settlement corrective (coverage_settled already latched) -> summarizer,
      #    reviewed per-plan over its own diff, never re-gap-checked or re-paneled;
      #  - more outline plans remain (plan_index < plan_total) -> the next plan-writer;
      #  - the last outline plan was implemented -> the once-only end-of-change gap-check.
      - name: review-base-repin
        quiet: true
        command: 'cd "$IMP_PROJECT_ROOT" && git rev-parse HEAD'
        rules:
          - {if: {exit: 0, review_scope: change}, set: {review_base: output.stdout}, goto: summarizer}
          - {if: {exit: 0, coverage_settled: true}, set: {review_base: output.stdout}, goto: summarizer}
          - {if: "output.exit == 0 and var.plan_index < var.plan_total", set: {review_base: output.stdout, plan_index: "var.plan_index + 1"}, goto: plan-writer}
          - {if: {exit: 0}, set: {review_base: output.stdout}, goto: gap-check}
          - {else: true, pause: true}

      # End-of-change coverage backstop — runs ONCE (the outline drives the plan loop, not
      # gap-check). Gap found -> author a corrective via plan-writer (fixpoint loop, latch
      # stays false). Clean -> latch coverage_settled; then run the change-wide review
      # (review_scope=change) iff the change spanned >1 plan, else go straight to summarizer.
      - name: gap-check
        file: agents/gap-check.md
        tier: high
        label: checking plan coverage
        rules:
          - {if: {more_plans: true}, set: {plan_total: "output.plan_total", plan_index: "var.plan_index + 1", review_scope: "'plan'"}, goto: plan-writer, label: "writing plan", feedback: "More plans are needed for this spec. Coverage assessment:"}
          - {if: "var.plan_total > 1", set: {coverage_settled: true, review_scope: "'change'"}, goto: plan-code-reviewer}
          - {else: true, set: {coverage_settled: true}, goto: summarizer}

      - name: summarizer
        file: agents/summarizer.md
        tier: medium
        label: summarizing change
        # Writes the intent-level summary artifact, then hands off unconditionally —
        # including on status: Error (it may have erred without committing). A missing
        # summary is not fatal: finalize falls back to its audit fields.
        rules:
          - {else: true, goto: finalize}

      - name: finalize
        file: agents/finalize.md
        tier: high
        label: finalizing
        max_loops: 20
        rules:
          - {if: {decision: merge},  goto: wait-for-head, label: "preparing to merge"}
          - {if: {decision: rework}, set: {plan_index: "var.plan_index + 1", plan_total: "var.plan_total + 1", review_scope: "'plan'"}, goto: plan-writer, label: "addressing review feedback", feedback: "Here's the feedback to address:"}
          - {else: true, pause: true}

  # ── integrate: the FIFO merge queue. Only the head touches the base. ───────
  - name: integrate
    label: "integration phase"
    steps:
      - name: wait-for-head
        acquire: base
        label: waiting in merge queue
        rules:
          - {else: true, continue: true}

      - name: integrate-rebase
        quiet: true
        command: ./scripts/integrate-rebase.sh
        rules:
          - {if: {exit: 2}, goto: cleanup-merge}                                   # base unmoved: route through cleanup so a reconciler commit from a prior merge pass gets stamped; idempotent no-op when already stamped
          - {if: {exit: 0}, set: {review_base: "''", integration_fork: output.stdout}, goto: integration-verify}    # clean replant: clear pin, capture fork, skip reconciler
          - {if: {exit: 6}, set: {review_base: "''", integration_fork: output.stdout}, continue: true}              # conflicts: clear pin, capture fork, run reconciler (next)
          - {else: true, pause: true}

      - name: reconciler
        file: agents/reconciler.md
        tier: high
        label: resolving merge conflicts
        rules:
          - {if: {stuck: true}, pause: true}
          - {else: true, continue: true}

      - name: integration-verify
        command: ./scripts/run-verify.sh
        label: running tests
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: reconciler}

      - name: integration-reviewer
        file: agents/integration-review.md
        tier: high
        label: reviewing merge conflicts
        max_loops: 6
        rules:
          - {if: {blocking: true}, resume: reconciler,
             label: "addressing integration review feedback",
             feedback: "Here's review feedback to address:"}
          - {if: {has_minor_findings: true}, resume: reconciler,
             label: "integrating minor improvements",
             feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          - {if: {status: Error}, pause: true}
          - {else: true, goto: cleanup-merge}

      - name: cleanup-merge
        quiet: true
        command: './scripts/cleanup.sh "{{ vars.review_base }}"'
        rules:
          - {if: {exit: 0}, goto: assert-stamped}
          - {if: {exit: 2}, continue: true}
          - {if: {exit: 3}, resume: reconciler}
          - {else: true, pause: true}

      - name: autosquash-resolve-merge
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving merge fixups
        max_loops: 6
        rules:
          - {else: true, goto: cleanup-merge}

      - name: assert-stamped
        quiet: true
        command: ./scripts/assert-stamped.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      - name: merge-to-base
        kind: merge_and_exit_worktree
        label: merging
        rules:
          - {if: {merge: MERGED}, continue: true}
          - {else: true, pause: true}
