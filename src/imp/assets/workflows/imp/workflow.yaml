name: feature
description: |
  spec -> (plan -> implement*)* -> review -> merge


# Single provider by design: review independence is by MODEL TIER (an opus panel
# reviewing sonnet's work), not by vendor. Review fires on an ACCUMULATED-TASK
# cadence decided by plan-cycle-check, which is the sole coverage guard: a single
# `code-reviewer` per batch (review_base..HEAD) when tasks_since_review crosses
# review_batch_size, and the full 4-member opus panel exactly once at change end
# (review_scope=change, merge-base..HEAD). deferred-sweep is paired with each review;
# verify and plan-review stay per-plan.

vars:
  fast_path:              {type: bool, default: false}
  spec_minors_integrated: {type: bool, default: false}
  plan_minors_integrated: {type: bool, default: false}
  plan_panel_done:        {type: bool, default: false}   # plan-review-panel re-verify dial (unrelated to review cadence)
  review_scope:           {type: string, default: plan}  # plan | change — per-batch vs end-of-change review
  review_base:            {type: string, default: ""}    # SHA defining the per-batch review diff range
  tasks_since_review:     {type: int, default: 0}         # accumulated implemented-task counter
  review_batch_size:      {type: int, default: 7}         # N: per-batch review fires when the counter crosses this
  merge_approved:         {type: bool, default: false}
  reintegrate_clean:      {type: bool, default: false}

defaults:
  max_retries: 3
  max_loops: 1000
  max_tool_calls: 10000

phases:
  - name: spec
    steps:
      - name: spec-writer
        file: agents/spec-writer.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/change/artifacts/spec/**"], mode: allow}
        rules:
          - {else: true, set: {fast_path: "output.complexity == 'trivial'"}, continue: true}

      - name: spec-verify-commit
        quiet: true
        command: ./scripts/spec-commit-verify.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: plan-writer}   # trivial fast path: skip spec-reviewer
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: spec-writer}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        # The reviewer gets the last word: the loop ends only on a clean review with
        # nothing left to integrate. spec_minors_integrated tracks whether the writer
        # has already spent its one minors-integration pass for the current settled
        # state — so a clean *verification* review stops and drops its own minors.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {spec_minors_integrated: false},
             resume: spec-writer, feedback: "Here's review feedback to address:"}
          # Clean with actionable minors, not yet integrated -> one minors pass; owe a verification review.
          - {if: {spec_minors_integrated: false, has_minor_findings: true}, set: {spec_minors_integrated: true},
             resume: spec-writer, feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean and settled (verification pass, or nothing actionable) -> proceed to planning.
          - {else: true, set: {spec_minors_integrated: false}, goto: plan-writer}

  - name: plan
    steps:
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/change/artifacts/plans/**"], mode: allow}

      - name: plan-verify-commit
        quiet: true
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: task-lead}   # trivial change: skip plan review entirely
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

      - name: plan-review
        file: agents/plan-review-panel.md
        tier: medium
        # The coordinator dispatches plan-reviewer subagents at their own high tier and
        # only collapses, so the step runs at medium. plan_minors_integrated tracks the
        # writer's one minors pass; plan_panel_done is the re-verify dial — true on the
        # two bounce-back branches (2->1 reviewers), false on the terminal branches so
        # the next plan starts fresh with a 2-reviewer first pass.
        rules:
          # Critical/Major -> rework, then re-verify. Clear the minors flag; set the dial.
          - {if: {blocking: true}, set: {plan_minors_integrated: false, plan_panel_done: true}, resume: plan-writer, feedback: "Here's review feedback to address:"}
          # Clean, and the writer already did its minors-integration pass -> stop; reset the dial.
          - {if: {plan_minors_integrated: true}, set: {plan_minors_integrated: false, plan_panel_done: false}, goto: task-lead}
          # Clean with actionable minors -> integrate them, then owe one more (verification) review.
          - {if: {has_minor_findings: true}, set: {plan_minors_integrated: true, plan_panel_done: true}, resume: plan-writer, feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean, nothing to integrate -> stop; reset the dial.
          - {else: true, set: {plan_panel_done: false}, goto: task-lead}

  - name: implement
    steps:
      - name: task-lead
        file: agents/task-lead.md
        tier: medium
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {if: {deviation: true}, resume: plan-writer, feedback: "The plan didn't match the codebase. Here's what the implementer found:"}
          - {if: {done: false},     goto: task-lead}
          - {else: true, continue: true}

      - name: commit-check
        quiet: true
        command: ./scripts/implement-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: task-lead}

      - name: verify
        command: ./scripts/run-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}   # timeout: re-running can't fix a too-slow suite — escalate to a human, don't loop task-lead
          - {else: true, resume: task-lead}

      # autosquash folds this plan's fixup chain into one-commit-per-task BEFORE any
      # review reads the diff. Clean fold -> pin the per-batch diff base; trivial
      # fast-path -> skip review entirely and let plan-cycle-check route to integration.
      - name: autosquash
        quiet: true
        command: ./scripts/autosquash.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: plan-cycle-check}   # trivial: no per-batch diff base needed
          - {if: {exit: 0}, goto: review-base-init}                    # clean fold / verified resolution -> pin diff base
          - {if: {exit: 2}, continue: true}                            # resolvable fold conflict -> autosquash-resolve
          - {else: true, pause: true}                                  # hard failure / verify bound exhausted

      - name: autosquash-resolve
        file: agents/autosquash-resolve.md
        tier: high
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}
        rules:
          - {else: true, goto: autosquash}

      # Capture the per-batch diff base ONCE, at the first implement entry (review_base
      # still empty): the fork point. Idempotent — later laps see a non-empty review_base
      # (re-pinned to HEAD after each batch) and leave it untouched.
      - name: review-base-init
        quiet: true
        command: ./scripts/pin-review-base.sh fork
        rules:
          - {if: {exit: 0, review_base: ''}, set: {review_base: output.stdout}, continue: true}
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      # SOLE arbiter of coverage AND review cadence. Increments tasks_since_review by the
      # just-completed plan's task count (read from the plan file) and emits the running
      # total as `running_tasks`. First-match-wins; more_plans:false wins over the counter.
      - name: plan-cycle-check
        file: agents/plan-cycle-check.md
        tier: medium
        rules:
          # batch full (more scope remains AND counter crossed N) -> per-batch review.
          # Force review_scope back to 'plan' so a stale 'change' from a prior end-of-change
          # pass (e.g. a finalize-rework that re-opens coverage) can never mislabel this
          # per-batch review as the full panel.
          - {if: "output.more_plans and output.running_tasks >= review_batch_size",
             set: {tasks_since_review: "output.running_tasks", review_scope: "'plan'"}, goto: review}
          # more scope, batch not full -> supercycle to plan-writer (skip review/sweep this lap)
          - {if: {more_plans: true}, set: {tasks_since_review: "output.running_tasks", review_scope: "'plan'"},
             goto: plan-writer, feedback: "More plans are needed for this spec. Coverage assessment:"}
          # coverage complete, trivial change -> no panel, straight to integration via stamp-trailers
          - {if: {fast_path: true}, set: {tasks_since_review: "output.running_tasks"}, goto: stamp-trailers}
          # coverage complete -> end-of-change FULL panel over the whole-change diff
          - {else: true, set: {review_scope: "'change'", tasks_since_review: "output.running_tasks"}, goto: review}

      # Per-batch = single code-reviewer over review_base..HEAD; end-of-change
      # (review_scope==change) = the full 4-member opus panel over merge-base..HEAD.
      # The review no longer judges coverage: verdict is approve | task_gap only.
      - name: review
        file: agents/review-panel.md
        tier: medium
        max_loops: 6
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: [".imp/change/**"], mode: allow}   # append deferred observations
        rules:
          - {if: {verdict: task_gap}, goto: task-lead, feedback: "The review panel found an implemented task needs rework. Findings:"}
          - {else: true, continue: true}

      - name: deferred-sweep
        file: agents/deferred-sweep.md
        tier: medium
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}

      - name: sweep-verify
        command: ./scripts/run-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: deferred-sweep}

      # After a batch's review + sweep settle, advance the diff base to HEAD and reset
      # the counter. The end-of-change pass (review_scope==change) is the last review,
      # so route it to integration (via the review-phase stamp-trailers); a per-batch
      # pass returns to plan-writer for the next plan.
      - name: review-base-repin
        quiet: true
        command: ./scripts/pin-review-base.sh head
        rules:
          - {if: {exit: 0, review_scope: change}, set: {review_base: output.stdout, tasks_since_review: 0}, goto: stamp-trailers}
          - {if: {exit: 0}, set: {review_base: output.stdout, tasks_since_review: 0}, goto: plan-writer}
          - {else: true, pause: true}

  - name: review
    steps:
      # Stamp the Change: trailer on every run commit ONCE, before integration. Content-
      # idempotent; a plain rebase preserves the trailer, so re-integration rounds need
      # no re-stamp. Reached from plan-cycle-check (fast-path) and review-base-repin
      # (end-of-change), so it runs on every path into integration.
      - name: stamp-trailers
        quiet: true
        command: ./scripts/stamp-trailers.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      - name: integrate-rebase
        quiet: true
        command: ./scripts/integrate-rebase.sh
        rules:
          - {if: {exit: 2, merge_approved: true}, goto: base-fresh-check}
          - {if: {exit: 2}, goto: finalize}
          - {if: {exit: 0}, set: {reintegrate_clean: true},  goto: integrate-verify}
          - {if: {exit: 6}, set: {reintegrate_clean: false}, continue: true}
          - {else: true, pause: true}

      - name: integrator
        file: agents/integrator.md
        tier: high
        fs_permissions:
          - {operations: [read],  paths: ["**"], mode: allow}
          - {operations: [write], paths: ["**"], mode: allow}

      - name: integrate-verify
        command: ./scripts/run-verify.sh
        max_loops: 5
        rules:
          - {if: {exit: 0, merge_approved: true, reintegrate_clean: true}, goto: base-fresh-check}
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: integrator}

      # After the rebase fully settles (clean exit, or conflict resolved AND verified),
      # advance review_base to the post-rebase HEAD: a later rework re-entry then diffs
      # from fully-reviewed work, never leaking the freshly-pulled base delta (Q1 fix).
      - name: repin-after-rebase
        quiet: true
        command: ./scripts/pin-review-base.sh head
        rules:
          - {if: {exit: 0}, set: {review_base: output.stdout}, continue: true}
          - {else: true, pause: true}

      - name: finalize
        file: agents/finalize.md
        tier: high
        max_loops: 20
        rules:
          - {if: {decision: merge},  set: {merge_approved: true},  goto: merge}
          - {if: {decision: rework}, set: {merge_approved: false}, goto: plan-writer, feedback: "Here's the feedback to address:"}
          - {else: true, pause: true}

  # ── merge ───────────────────────────────────────────────────────────
  - name: merge
    steps:
      - name: base-fresh-check       # B3: cheap pre-lock freshness fast-path
        quiet: true
        command: ./scripts/base-fresh-check.sh
        max_loops: 10
        rules:
          - {if: {exit: 0}, continue: true}          # base unchanged / not-integrated -> take the lock
          - {if: {exit: 10}, goto: integrate-rebase}  # base advanced -> re-integrate
          - {else: true, pause: true}                # exit 1 preamble failure -> human

      - name: merge-to-base          # B3: engine-native, lock-protected, routable
        kind: merge
        rules:
          - {if: {merge: STALE}, goto: integrate-rebase}   # base moved between check and lock -> re-integrate
          - {if: {merge: MERGED}, continue: true}          # falls through to _complete finalize
          - {else: true, pause: true}                      # defensive fallback; _route_merge intercepts CONFLICT/REFUSED/DIRTY first to emit merge_blocked + a reasoned pause
