name: feature
description: |
  threshold -> spec -> (plan -> implement)* -> converge -> integrate

# Single provider by design: review independence is by MODEL TIER (a high-tier
# reviewer judging the coder's work), not by vendor. The per-plan implement loop
# carries NO code review and NO sweep: each plan's tasks are implemented and
# fast-verified, then check-next-plan either starts the next outline plan or
# (last plan done) enters converge. converge runs ONCE per change: gap-check (the
# sole coverage backstop; latches coverage_settled) -> change-review (the single
# change-wide code review, reusing agents/plan-code-reviewer.md) -> deferred-sweep
# (drains the whole change's Deferred list once) -> converge-verify (slow, on the
# change's own base). integrate then
# acquires the merge lane, rebases, slow-re-verifies only when the base moved,
# reviews the integration, and ends at the human gate (summarizer -> finalize) so
# the human blesses the locked, rebased, slow-tested state. cleanup.sh folds
# fixups and stamps the Change: trailer once, over cur_base_head..HEAD.

vars:
  fast_path:              {type: bool, default: false}
  auto_merge:             {type: bool, default: true}
  spec_minors_integrated: {type: bool, default: false}
  plan_minors_integrated: {type: bool, default: false}
  coverage_settled:       {type: bool, default: false}
  integration_fork:       {type: string, default: ""}
  slow_verify_tolerated:  {type: bool, default: false}
  plan_index:             {type: int, default: 1}
  plan_total:             {type: int, default: 1}
  task_total:             {type: int, default: 0}

defaults:
  max_retries: 3
  max_loops: 1000
  max_tool_calls: 10000

phases:
  # ── threshold: phase 0, a bare conversation (show_label:false). It answers
  # questions, scouts existing work, or scopes a build; on go-live it sets the
  # ceremony and routes into the pipeline. express skips the spec beat entirely
  # (the new edge); full enters spec-finalizer for adopt-with-light-review.
  - name: threshold
    show_label: false
    steps:
      - name: threshold
        file: agents/threshold.md
        tier: high
        interactive: true
        rules:
          - {if: {ceremony: express}, set: {fast_path: true}, goto: plan-writer, label: "writing plan", feedback: "Plan this from the spec drafted with the user:"}
          - {else: true, set: {fast_path: false}, goto: spec-finalizer, label: "writing spec", feedback: "Adopt the spec drafted with the user and finalize it:"}

  - name: spec
    label: "spec phase"
    steps:
      - name: spec-finalizer
        file: agents/spec-finalizer.md
        tier: high
        label: finalizing spec
        rules:
          - {else: true, continue: true}

      - name: spec-verify-commit
        show_label: false
        command: ./scripts/spec-commit-verify.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: spec-finalizer}

      - name: spec-reviewer
        file: agents/spec-reviewer.md
        tier: high
        label: reviewing spec
        read_only: ["."]
        # The reviewer gets the last word: the loop ends only on a clean review with
        # nothing left to integrate. spec_minors_integrated tracks whether the writer
        # has already spent its one minors-integration pass for the current settled
        # state — so a clean *verification* review stops and drops its own minors.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {spec_minors_integrated: false},
             resume: spec-finalizer, label: "addressing spec review feedback", feedback: "Here's review feedback to address:"}
          # Clean with actionable minors, not yet integrated -> one minors pass; owe a verification review.
          - {if: {spec_minors_integrated: false, has_minor_findings: true}, set: {spec_minors_integrated: true},
             resume: spec-finalizer, label: "addressing spec review feedback", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean and settled (verification pass, or nothing actionable) -> proceed to planning.
          - {else: true, set: {spec_minors_integrated: false}, goto: plan-writer}

  - name: plan
    label: "planning phase · plan {{ vars.plan_index }}/{{ vars.plan_total }}"
    steps:
      # plan-writer is the plan-phase entry: the spec phase routes here, and supercycle/rework goto plan-writer directly.
      - name: plan-writer
        file: agents/plan-writer.md
        tier: high
        label: "writing plan"
        rules:
          # First plan only: seed plan_total from plan-writer's outline-derived count.
          # On later plans gap-check owns plan_total (it bumps it only when authoring a
          # corrective), so this capture must not re-fire.
          - {if: {plan_index: 1}, set: {plan_total: output.plan_total}, continue: true}
          - {else: true, continue: true}

      - name: plan-verify-commit
        show_label: false
        command: ./scripts/plan-commit-verify.sh
        rules:
          - {if: {exit: 0, fast_path: true}, goto: plan-finalized}   # trivial change: skip plan review entirely
          - {if: {exit: 0}, continue: true}
          - {else: true, resume: plan-writer}

      - name: plan-reviewer
        file: agents/plan-reviewer.md
        tier: high
        label: "reviewing plan"
        read_only: ["."]
        # A single plan-reviewer runs directly as the step at its own high tier (the
        # prior medium tier was only the coordinator's dispatch-and-collapse cost); the
        # engine routes its {status, findings, blocking, has_minor_findings} output
        # through these rules. plan_minors_integrated tracks the writer's one minors-
        # integration pass: set only on the clean-with-minors bounce-back, cleared on
        # every rework/terminal branch. Mirrors the spec minors loop.
        rules:
          # Critical/Major -> rework, then re-review. Clear the minors flag: a real fix re-opens the one minors pass.
          - {if: {blocking: true}, set: {plan_minors_integrated: false}, resume: plan-writer, label: "addressing plan review feedback", feedback: "Here's review feedback to address:"}
          # Clean, and the writer already did its minors-integration pass -> stop.
          - {if: {plan_minors_integrated: true}, set: {plan_minors_integrated: false}, goto: plan-finalized}
          # Clean with actionable minors -> integrate them, then owe one more (verification) review.
          - {if: {has_minor_findings: true}, set: {plan_minors_integrated: true}, resume: plan-writer, label: "addressing plan review feedback", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          # Clean, nothing to integrate -> stop.
          - {else: true, goto: plan-finalized}

      - name: plan-finalized
        label: "finalizing plan"
        command: ./scripts/plan-finalized.sh {{ vars.plan_index }} {{ vars.plan_total }}
        show_output: true
        output:
          task_total: {type: int}
        rules:
          - {else: true, set: {task_total: output.task_total}, goto: task-lead}

  - name: implement
    label: "implementation phase · plan {{ vars.plan_index }}/{{ vars.plan_total }}"
    steps:
      - name: task-lead
        position_label: true
        file: agents/task-lead.md
        tier: high
        label: "task 1/{{ vars.task_total }}"
        rotate_phrase: true
        rules:
          - {if: {verify_tolerated: true}, goto: check-next-plan}
          - {else: true, continue: true}

      - name: verify
        command: ./scripts/run-verify.sh fast
        interruptible: true
        acquire: test-lane
        label: running tests
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: task-lead}

      # Routing-only branch. After a plan's tasks settle:
      #  - a converge/finalize rework (coverage_settled latched) -> change-review (re-review, never re-gap-check);
      #  - more outline plans remain -> the next plan-writer (plan_index++);
      #  - the last outline plan was implemented -> the once-only gap-check (enter converge).
      - name: check-next-plan
        show_label: false
        rules:
          - {if: {coverage_settled: true}, goto: change-review}
          - {if: "var.plan_index < var.plan_total", set: {plan_index: "var.plan_index + 1"}, goto: plan-writer, label: "writing plan"}
          - {else: true, goto: gap-check}

  # ── converge: runs ONCE per change (change-local, NO lock). The coverage backstop,
  # the single change-wide code review, the once-per-change deferred sweep, and the
  # slow verify on the change's own base.
  - name: converge
    label: "convergence phase"
    steps:
      # End-of-change coverage backstop — runs ONCE. Gap found -> author a corrective via
      # plan-writer (latch stays false). Clean -> latch coverage_settled and run the
      # change-wide review.
      - name: gap-check
        file: agents/gap-check.md
        tier: high
        label: checking plan coverage
        rules:
          - {if: {more_plans: true}, set: {plan_total: "output.plan_total", plan_index: "var.plan_index + 1"}, goto: plan-writer, label: "writing plan", feedback: "More plans are needed for this spec. Coverage assessment:"}
          - {else: true, set: {coverage_settled: true}, goto: change-review}

      # The single change-wide code review (cur_base_head..HEAD), reusing plan-code-reviewer.md.
      # approve -> deferred-sweep; task_gap -> task-lead rework.
      - name: change-review
        file: agents/plan-code-reviewer.md
        tier: high
        label: reviewing change
        max_loops: 6
        rules:
          - {if: {verdict: task_gap}, goto: task-lead, label: "addressing code review feedback", feedback: "The plan-code-reviewer found an implemented task needs rework. Findings:"}
          - {if: {status: Error}, pause: true}
          - {else: true, goto: deferred-sweep}

      - name: deferred-sweep
        file: agents/deferred-sweep.md
        tier: high
        label: sweeping deferred tasks
        rules:
          - {if: {converge_verify_tolerated: true}, set: {slow_verify_tolerated: true}, goto: wait-for-head}
          - {else: true, continue: true}

      # Slow tests on the change's own base (off-lock). Clean -> enter integrate. A failure
      # resumes deferred-sweep in slow-gate triage: a fix loops back through converge-verify;
      # a "not ours" toleration emits converge_verify_tolerated
      # -> wait-for-head (forward escape; this gate never re-runs).
      - name: converge-verify
        command: ./scripts/run-verify.sh slow
        interruptible: true
        acquire: test-lane
        label: running tests
        max_loops: 5
        rules:
          - {if: {exit: 0}, goto: wait-for-head}
          - {if: {exit: 124}, pause: true}
          - {else: true, resume: deferred-sweep, feedback: "The slow verify gate (converge-verify) failed. Triage fix-vs-tolerate:"}

  # ── integrate: the FIFO merge queue (base lock from wait-for-head). Rebase, slow
  # re-verify only when the base moved, review the integration, then the human gate.
  - name: integrate
    label: "integration phase"
    steps:
      - name: wait-for-head
        acquire: merge-lane
        label: waiting in merge queue
        rules:
          - {else: true, continue: true}

      - name: integrate-rebase
        show_label: false
        command: ./scripts/integrate-rebase.sh "{{ vars.slow_verify_tolerated }}"
        rules:
          - {if: {exit: 2}, goto: summarizer}
          - {if: {exit: 0}, set: {integration_fork: output.stdout}, goto: integration-verify}
          - {if: {exit: 7}, set: {integration_fork: output.stdout}, goto: integration-verify}
          - {if: {exit: 6}, set: {integration_fork: output.stdout}, continue: true}
          - {else: true, pause: true}

      - name: reconciler
        file: agents/reconciler.md
        tier: high
        label: resolving merge conflicts
        rules:
          - {if: {stuck: true}, pause: true}
          - {else: true, continue: true}

      - name: integration-verify
        command: ./scripts/run-verify.sh slow
        interruptible: true
        acquire: test-lane
        label: running tests
        max_loops: 5
        rules:
          - {if: {exit: 0}, continue: true}
          - {if: {exit: 124}, pause: true}
          - {else: true, goto: integration-reviewer, feedback: "Integration tests failed on the merged tree. Adjudicate fix-vs-tolerate:"}

      - name: integration-reviewer
        file: agents/integration-review.md
        tier: high
        label: reviewing merge conflicts
        max_loops: 6
        rules:
          - {if: {blocking: true}, resume: reconciler, label: "addressing integration review feedback", feedback: "Here's review feedback to address:"}
          - {if: {has_minor_findings: true}, resume: reconciler, label: "integrating minor improvements", feedback: "No blocking issues — integrate these minor improvements; a final review follows:"}
          - {if: {status: Error}, pause: true}
          - {else: true, set: {slow_verify_tolerated: output.tolerated}, goto: summarizer}

      - name: summarizer
        file: agents/summarizer.md
        tier: medium
        label: summarizing change
        rules:
          - {else: true, goto: finalize}

      - name: finalize
        file: agents/finalize.md
        tier: high
        label: finalizing
        interactive: true
        max_loops: 20
        rules:
          - {if: {decision: merge},  goto: cleanup-merge, label: "preparing to merge"}
          - {if: {decision: rework}, set: {plan_index: "var.plan_index + 1", plan_total: "var.plan_total + 1"}, goto: plan-writer, release: merge-lane, label: "addressing review feedback", feedback: "Here's the feedback to address:"}
          - {else: true, pause: true}

      - name: cleanup-merge
        show_label: false
        command: ./scripts/cleanup.sh
        rules:
          - {if: {exit: 0}, goto: assert-stamped}
          - {if: {exit: 2}, continue: true}
          - {else: true, pause: true}

      - name: autosquash-resolve-merge
        file: agents/autosquash-resolve.md
        tier: high
        label: resolving merge fixups
        max_loops: 6
        clean_tree: false   # operates on an in-progress autosquash rebase whose
                            # legitimate completion may still be mid-rebase
        rules:
          - {else: true, goto: cleanup-merge}

      - name: assert-stamped
        show_label: false
        command: ./scripts/assert-stamped.sh
        rules:
          - {if: {exit: 0}, continue: true}
          - {else: true, pause: true}

      - name: merge-to-base
        kind: merge_and_exit_worktree
        label: merging
        max_loops: 3                      # recovery passes before giving up to a human
        rules:
          - {if: {merge: MERGED},   continue: true}
          - {if: {merge: DIRTY},    goto: reconciler,
             label: "recovering merge",
             feedback: "The merge couldn't proceed because the change worktree still had uncommitted changes. Commit your resolution; integration will retry."}
          - {if: {merge: CONFLICT}, goto: integrate-rebase, label: "retrying integration"}
          - {if: {merge: REFUSED},  pause: true}
          - {else: true, pause: true}
