description: |
  front-door -> implement -> review -> finalize

  A minimal workflow. It scopes a small change in an open conversation (reusing the
  shared front-door), then on go-live forks an isolated worktree on imp/<id> and
  builds it there — no plan is written, no merge happens. A read-only reviewer bounces
  the implementer until the change is approved, then an interactive finalize gate lets
  the user review the change and request tweaks before the run completes, leaving the
  commits on the imp/<id> branch for the user to integrate manually. Review
  independence is by MODEL TIER (a high-tier reviewer judging the implementer's work),
  not by vendor.

defaults:
  max_retries: 3
  max_loops: 10
  max_tool_calls: 10000

phases:
  # ── front-door: a bare conversation (show_label:false) that scopes the change and,
  # on go-live, forks an isolated worktree on imp/<id> (via create_and_enter_worktree)
  # and writes the FINAL spec, then routes into the build in that worktree.
  - name: front-door
    show_label: false
    steps:
      - name: front-door
        file: agents/front-door.md
        tier: high
        interactive: true
        rules:
          - {if: {status: Error}, pause: true}
          - {else: true, continue: true}

  - name: implement
    label: "implementation phase"
    steps:
      - name: implement
        file: agents/implementer.md
        tier: high
        label: "building the change"
        rules:
          - {if: {status: Error}, pause: true}
          - {else: true, continue: true}

  - name: review
    label: "review phase"
    steps:
      # Read-only reviewer. approve -> continues into the finalize phase.
      # rework -> resume implement with the reviewer's findings.
      - name: review
        file: agents/reviewer.md
        tier: high
        label: "reviewing the change"
        read_only: ["."]
        rules:
          - {if: {verdict: rework}, resume: implement, label: "addressing review feedback", feedback: "Here's review feedback to address:"}
          - {if: {status: Error}, pause: true}
          - {else: true, continue: true}

  - name: finalize
    label: "finalize phase"
    steps:
      - name: finalize
        file: agents/finalize.md
        tier: high
        label: "finalizing"
        interactive: true
        rules:
          - {if: {status: Error}, pause: true}
          - {else: true, continue: true}
