# name → canned events; engine asserts the final event is agent_result or error.
stub:
  events:
    - {type: agent_result, payload: {status: Success}}

failing-stub:
  events:
    - {type: agent_result, payload: {status: Error}}

crashing-stub:
  events:
    - {type: error, payload: {message: "intentional crash"}}

context-loader:
  events:
    - {type: agent_result, payload: {status: Success, notes: "loaded"}}

intent-clarifier:
  events:
    - {type: agent_result, payload: {status: Success, summary: "captured"}}

coder:
  events:
    - {type: agent_result, payload: {status: Success}}

reviewer:
  events:
    - {type: agent_result, payload: {status: Success, verdict: ok}}

reviewer-bad:
  events:
    - {type: agent_result, payload: {status: Success, verdict: bad}}
