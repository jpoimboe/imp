# name → canned events; engine asserts the final event is agent_output or error.
stub:
  events:
    - {type: agent_message, payload: {text: "ok"}}
    - {type: agent_output, payload: {status: Success}}

failing-stub:
  events:
    - {type: agent_message, payload: {text: "trying"}}
    - {type: agent_output, payload: {status: Error}}

crashing-stub:
  events:
    - {type: error, payload: {message: "intentional crash"}}

context-loader:
  events:
    - {type: agent_output, payload: {status: Success, notes: "loaded"}}

intent-clarifier:
  events:
    - {type: agent_output, payload: {status: Success, summary: "captured"}}

coder:
  events:
    - {type: agent_output, payload: {status: Success}}

reviewer:
  events:
    - {type: agent_output, payload: {status: Success, verdict: ok}}

reviewer-bad:
  events:
    - {type: agent_output, payload: {status: Success, verdict: bad}}
